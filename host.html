<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>진행 화면 · 본사2지부 문화행사</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/base.css">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
  body.host { background: #050f33; overflow: hidden; height: 100vh; }
  #stage {
    position: fixed;
    left: 50%;
    top: 50%;
    width: 1920px;
    height: 1080px;
    transform: translate(-50%, -50%) scale(var(--s, 0.5));
    background: var(--page);
    overflow: hidden;
    user-select: none;
  }

  .slide { position: absolute; inset: 0; display: flex; flex-direction: column; animation: enter 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  @keyframes enter { from { opacity: 0; transform: translateY(28px); } }
  .title { font-size: 64px; font-weight: 800; letter-spacing: -0.02em; margin: 0; color: var(--b-navy); }
  .eyebrow { display: inline-flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 700; color: var(--b-blue); letter-spacing: 0.02em; }
  .eyebrow .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--b-blue); box-shadow: 0 0 0 8px rgba(29, 87, 230, 0.15); animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 16px rgba(29, 87, 230, 0); } }

  .chips { display: flex; flex-wrap: wrap; gap: 12px; }
  .chip {
    display: inline-flex; align-items: center; height: 56px; padding: 0 24px; border-radius: 999px;
    background: #fff; border: 2px solid var(--b-sky-2); color: var(--b-navy); font-size: 28px; font-weight: 700; white-space: nowrap;
  }
  .chip.new { animation: pop 0.6s cubic-bezier(0.3, 1.6, 0.5, 1) both; border-color: var(--b-blue); }
  @keyframes pop { from { transform: scale(0.3); opacity: 0; } }
  .chip.more { background: var(--b-sky); border-color: transparent; color: var(--b-blue-700); }
  .chip[hidden] { display: none; }

  .qr svg { display: block; width: 100%; height: 100%; }

  /* ── 표지 ── */
  .cover { display: grid; grid-template-columns: 1fr 780px; }
  .cover-left { padding: 110px 100px 90px 120px; display: flex; flex-direction: column; min-width: 0; }
  .cover-title { font-size: 128px; line-height: 1.08; font-weight: 900; letter-spacing: -0.035em; color: var(--b-navy); margin: 36px 0 0; }
  .cover-sub { font-size: 56px; font-weight: 800; color: var(--b-blue); margin: 22px 0 0; letter-spacing: -0.02em; }
  .steps { list-style: none; display: flex; gap: 20px; padding: 0; margin: 64px 0 0; }
  .steps li { flex: 1; display: flex; align-items: center; gap: 20px; background: #fff; border-radius: 24px; padding: 26px 28px; box-shadow: var(--shadow); }
  .steps b { flex: none; width: 64px; height: 64px; border-radius: 50%; background: var(--b-blue); color: #fff; display: grid; place-items: center; font-size: 32px; }
  .steps span { font-size: 28px; font-weight: 700; line-height: 1.35; color: var(--ink); }
  .joined { margin-top: auto; }
  .joined-count { font-size: 40px; font-weight: 700; color: var(--ink-2); margin-bottom: 22px; }
  .joined-count strong { font-size: 76px; font-weight: 900; color: var(--b-blue); margin-right: 6px; font-variant-numeric: tabular-nums; }
  .joined .chips { max-height: 204px; overflow: hidden; }
  .cover-right {
    position: relative; overflow: hidden;
    background: radial-gradient(circle at 80% 0%, #3d77ff 0%, transparent 55%), linear-gradient(160deg, var(--b-blue) 0%, var(--b-navy) 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff;
  }
  .cover-right::before, .cover-right::after { content: ''; position: absolute; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.12); }
  .cover-right::before { width: 900px; height: 900px; left: -200px; bottom: -520px; }
  .cover-right::after { width: 560px; height: 560px; right: -240px; top: -200px; }
  .qr-card { position: relative; z-index: 1; background: #fff; border-radius: 40px; padding: 36px; box-shadow: 0 40px 80px rgba(3, 12, 45, 0.35); }
  .qr-card .qr { width: 520px; height: 520px; }
  .qr-caption { position: relative; z-index: 1; margin-top: 44px; text-align: center; }
  .qr-caption b { display: block; font-size: 44px; font-weight: 800; }
  .qr-caption span { display: block; margin-top: 12px; font-size: 28px; opacity: 0.8; font-weight: 600; letter-spacing: 0.01em; }

  /* ── 문제 ── */
  .question { padding: 60px 96px 56px; }
  .q-head { display: flex; align-items: center; gap: 28px; height: 120px; }
  .q-badge { display: flex; align-items: baseline; gap: 4px; background: var(--b-blue); color: #fff; border-radius: 26px; padding: 14px 30px; font-weight: 900; font-size: 40px; }
  .q-badge span { font-size: 64px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .q-of { font-size: 40px; font-weight: 800; color: var(--muted); }
  .q-progress { flex: 1; display: flex; gap: 10px; margin: 0 24px; }
  .q-progress i { flex: 1; height: 12px; border-radius: 6px; background: var(--b-sky-2); }
  .q-progress i.done { background: var(--b-blue); }
  .q-progress i.now { background: var(--b-blue); opacity: 0.45; }
  .mini-qr { display: flex; align-items: center; gap: 18px; background: #fff; border-radius: 22px; padding: 12px 22px 12px 12px; box-shadow: var(--shadow); }
  .mini-qr .qr { width: 104px; height: 104px; }
  .mini-qr span { font-size: 24px; font-weight: 700; line-height: 1.35; color: var(--ink-2); }
  .q-text { margin: 40px 0 40px; font-weight: 800; line-height: 1.3; letter-spacing: -0.025em; color: var(--b-navy); font-size: 72px; }
  .q-text.md { font-size: 60px; }
  .q-text.sm { font-size: 50px; }

  .options { flex: 1; min-height: 0; display: grid; gap: 28px; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; }
  .options.n3 { grid-template-columns: 1fr; }
  .opt {
    position: relative; display: flex; align-items: center; gap: 30px; padding: 0 44px; min-height: 0;
    background: #fff; border: 3px solid var(--line); border-radius: 32px; overflow: hidden; box-shadow: var(--shadow);
    transition: opacity 0.5s, transform 0.5s cubic-bezier(0.3, 1.4, 0.5, 1), background 0.4s, border-color 0.4s, box-shadow 0.4s, color 0.4s;
  }
  .opt > * { position: relative; z-index: 1; }
  .opt .num { flex: none; width: 80px; height: 80px; border-radius: 50%; background: var(--b-sky); color: var(--b-blue); font-size: 42px; font-weight: 900; display: grid; place-items: center; transition: background 0.4s; }
  .opt .label { flex: 1; font-size: 48px; font-weight: 750; line-height: 1.25; }
  .options.short .opt { justify-content: center; }
  .options.short .opt .label { flex: none; font-size: 150px; font-weight: 900; }
  .options.short .opt .num { position: absolute; left: 36px; top: 36px; }
  .options.short .opt .stat { position: absolute; right: 40px; bottom: 32px; }
  .opt .stat { font-size: 34px; font-weight: 800; color: var(--ink-2); white-space: nowrap; opacity: 0; transition: opacity 0.4s 0.3s; font-variant-numeric: tabular-nums; }
  .opt .fill { position: absolute; inset: 0 auto 0 0; z-index: 0; width: 0; background: var(--b-sky); transition: width 1s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s; }
  .opt .check { display: none; flex: none; width: 64px; height: 64px; }
  .revealed .opt .stat { opacity: 1; }
  .revealed .opt .fill { width: var(--pct, 0%); }
  .revealed .opt:not(.correct) { opacity: 0.5; box-shadow: none; }
  .revealed .opt.correct { background: var(--b-blue); border-color: var(--b-blue); color: #fff; transform: scale(1.025); box-shadow: 0 24px 60px rgba(29, 87, 230, 0.38); }
  .revealed .opt.correct .num { background: #fff; }
  .revealed .opt.correct .fill { background: rgba(255, 255, 255, 0.16); }
  .revealed .opt.correct .stat { color: #fff; }
  .revealed .opt.correct .check { display: block; }
  .options.short .opt .check { position: absolute; right: 40px; top: 36px; }

  .explain { display: none; margin-top: 26px; padding: 22px 32px; border-radius: 22px; background: #fff; border-left: 10px solid var(--b-blue); font-size: 34px; font-weight: 600; color: var(--ink-2); line-height: 1.45; }
  .revealed .explain.has { display: block; animation: enter 0.5s 0.4s both; }

  .q-foot { display: flex; align-items: center; gap: 36px; margin-top: 30px; height: 64px; }
  .live { display: inline-flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 800; color: var(--b-blue); background: var(--b-sky); border-radius: 999px; padding: 12px 26px; }
  .live i { width: 14px; height: 14px; border-radius: 50%; background: var(--b-blue); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0.2; } }
  .revealed .live { background: var(--b-navy); color: #fff; }
  .revealed .live i { display: none; }
  .answered { display: flex; align-items: center; gap: 22px; font-size: 32px; font-weight: 700; color: var(--ink-2); }
  .answered b { color: var(--ink); font-size: 40px; font-variant-numeric: tabular-nums; }
  .meter { width: 420px; height: 14px; border-radius: 7px; background: var(--b-sky-2); overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; background: var(--b-blue); border-radius: 7px; transition: width 0.6s; }
  .voters { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; max-height: 106px; overflow: hidden; }
  .voters:empty { display: none; }
  .voters .chip { height: 48px; padding: 0 20px; font-size: 24px; }
  .voters .chip.ok { background: var(--b-blue); border-color: var(--b-blue); color: #fff; }
  .voters .chip.no { opacity: 0.4; }
  .key-hint { margin-left: auto; font-size: 26px; font-weight: 600; color: var(--muted); }
  .key-hint kbd { font: inherit; font-weight: 800; color: var(--ink-2); background: #fff; border: 2px solid var(--line); border-radius: 10px; padding: 2px 12px; margin-right: 8px; }

  /* ── 결과 ── */
  .result { padding: 80px 110px 70px; }
  .result-grid { display: grid; grid-template-columns: 520px 1fr; gap: 40px; margin-top: 48px; flex: 1; min-height: 0; }
  .tiles { display: grid; grid-template-rows: repeat(3, 1fr); gap: 24px; }
  .tile { background: #fff; border-radius: 32px; padding: 30px 40px; box-shadow: var(--shadow); display: flex; flex-direction: column; justify-content: center; }
  .tile span { font-size: 30px; font-weight: 700; color: var(--ink-2); }
  .tile b { font-size: 96px; font-weight: 900; color: var(--ink); letter-spacing: -0.03em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .tile b small { font-size: 40px; font-weight: 700; margin-left: 6px; color: var(--ink-2); }
  .tile.accent { background: var(--b-blue); }
  .tile.accent span, .tile.accent b, .tile.accent b small { color: #fff; }
  .chart-card { background: #fff; border-radius: 32px; padding: 36px 44px 28px; box-shadow: var(--shadow); display: flex; flex-direction: column; min-height: 0; }
  .chart-card h3 { margin: 0 0 8px; font-size: 32px; font-weight: 800; color: var(--ink); }
  .chart-card svg { flex: 1; width: 100%; min-height: 0; }
  .perfect { display: flex; align-items: center; gap: 28px; margin-top: 32px; min-height: 64px; }
  .perfect > span { flex: none; font-size: 30px; font-weight: 800; color: var(--b-blue); }
  .perfect .chips { max-height: 56px; overflow: hidden; }

  /* ── 추첨 ── */
  .draw { padding: 64px 96px; }
  .arena { position: absolute; inset: 0; z-index: 0; overflow: hidden; }
  .arena .chip { position: absolute; left: 0; top: 0; opacity: 0.32; will-change: transform; }
  .arena.idle .chip { animation: drift 6s ease-in-out infinite alternate; }
  @keyframes drift { to { translate: 18px -22px; } }
  .draw-head { position: relative; z-index: 2; display: flex; align-items: center; gap: 40px; }
  .pool-picker { margin-left: auto; display: flex; gap: 16px; }
  .pill { display: inline-flex; align-items: center; gap: 14px; height: 76px; padding: 0 30px; border-radius: 999px; border: 3px solid var(--b-sky-2); background: #fff; font-size: 30px; font-weight: 800; color: var(--ink-2); }
  .pill.on { border-color: var(--b-blue); color: var(--b-blue-700); background: var(--b-sky); }
  .pill em { font-style: normal; font-weight: 700; color: var(--muted); }
  .pill.on em { color: var(--b-blue); }
  .pill .step { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--b-sky-2); color: var(--b-blue-700); font-size: 34px; font-weight: 900; line-height: 1; display: grid; place-items: center; }
  .pill .step:hover { background: var(--b-sky-3); }
  .pill b { min-width: 40px; text-align: center; font-size: 36px; color: var(--ink); }

  .draw-body { position: relative; z-index: 2; flex: 1; display: grid; grid-template-columns: 1fr 380px; gap: 48px; margin-top: 40px; min-height: 0; pointer-events: none; }
  .draw-body > * { pointer-events: auto; }
  .slot-wrap { display: grid; place-items: center; }
  .slot {
    width: 1100px; background: #fff; border-radius: 48px; padding: 52px 60px 46px; text-align: center;
    box-shadow: 0 30px 80px rgba(11, 31, 91, 0.18); border: 4px solid var(--b-sky-2); transition: border-color 0.3s, box-shadow 0.3s, transform 0.3s;
  }
  .slot-label { font-size: 32px; font-weight: 700; color: var(--ink-2); }
  .slot-label b { color: var(--b-blue); font-size: 40px; font-variant-numeric: tabular-nums; }
  .slot-name { height: 220px; display: grid; place-items: center; font-size: 150px; font-weight: 900; color: var(--b-navy); letter-spacing: -0.03em; white-space: nowrap; overflow: hidden; }
  .slot-name.ready { color: var(--b-sky-3); font-size: 120px; }
  .slot-hint { font-size: 30px; font-weight: 600; color: var(--muted); }
  .slot-hint kbd { font: inherit; font-weight: 800; color: var(--ink-2); background: var(--b-sky); border-radius: 10px; padding: 4px 14px; margin: 0 4px; }
  .draw.qd .draw-body { grid-template-columns: 1fr; }
  .slot-wrap { min-height: 0; }
  .slot-wrap.show-roster .slot, .slot-wrap:not(.show-roster) .roster-box { display: none; }
  .roster-box { display: flex; flex-direction: column; align-items: center; gap: 40px; width: 100%; }
  .roster { display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 18px; max-width: 1640px; max-height: 620px; overflow: hidden; }
  .roster .chip { height: auto; padding: 0.3em 0.85em; font-size: var(--fs, 40px); border-width: 3px; border-color: var(--b-blue); box-shadow: var(--shadow); animation: pop 0.5s cubic-bezier(0.3, 1.6, 0.5, 1) both; }
  .roster .chip.more { border-color: transparent; box-shadow: none; background: var(--b-sky); color: var(--b-blue-700); }
  .slot-actions { display: flex; justify-content: center; gap: 14px; }
  .slot-actions[hidden] { display: none; }
  .slot .again { margin-top: 20px; border: 0; background: var(--b-sky); color: var(--b-blue-700); font-size: 26px; font-weight: 800; padding: 12px 30px; border-radius: 999px; }
  .slot .again:hover { background: var(--b-sky-2); }

  .winners { background: #fff; border-radius: 36px; padding: 34px 30px; box-shadow: var(--shadow); display: flex; flex-direction: column; min-height: 0; }
  .winners h3 { margin: 0 0 20px; font-size: 32px; font-weight: 800; display: flex; align-items: center; gap: 12px; }
  .winners h3 small { font-size: 26px; color: var(--muted); font-weight: 700; }
  .winners ol { list-style: none; margin: 0; padding: 0; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
  .winners li { display: flex; align-items: center; gap: 16px; font-size: 32px; font-weight: 800; padding: 10px 12px; border-radius: 18px; }
  .winners li:hover { background: var(--b-sky); }
  .winners li i { flex: none; font-style: normal; min-width: 52px; height: 52px; padding: 0 12px; border-radius: 26px; background: var(--b-blue); color: #fff; display: grid; place-items: center; font-size: 26px; }
  .winners li i.q { background: var(--b-sky); color: var(--b-blue-700); }
  .winners li span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .winners li button { opacity: 0; border: 0; background: transparent; color: var(--muted); font-size: 22px; font-weight: 700; padding: 6px 10px; border-radius: 10px; }
  .winners li:hover button { opacity: 1; }
  .winners li button:hover { background: #fff; color: var(--danger); }
  .winners .empty { font-size: 26px; color: var(--muted); font-weight: 600; line-height: 1.5; }

  .wheel { position: absolute; inset: 0; z-index: 5; width: 1920px; height: 1080px; pointer-events: none; }
  .wheel[hidden] { display: none; }
  .draw.wheel-on .draw-body, .draw.wheel-on .arena { visibility: hidden; }
  .win-overlay {
    position: absolute; inset: 0; z-index: 10; display: grid; place-items: center; text-align: center; color: #fff;
    background: radial-gradient(circle at 50% 40%, #3d77ff, var(--b-navy) 72%);
    animation: fadein 0.4s both;
  }
  .win-overlay[hidden] { display: none; }
  @keyframes fadein { from { opacity: 0; } }
  .win-overlay canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; pointer-events: none; }
  .win-card { position: relative; animation: zoom 0.7s cubic-bezier(0.3, 1.5, 0.5, 1) both 0.1s; }
  @keyframes zoom { from { transform: scale(0.4); opacity: 0; } }
  .win-rank { display: inline-block; font-size: 36px; font-weight: 800; background: rgba(255, 255, 255, 0.16); border-radius: 999px; padding: 12px 34px; }
  .win-label { font-size: 64px; font-weight: 800; margin-top: 34px; color: var(--gold); }
  .win-name { font-size: 220px; font-weight: 900; letter-spacing: -0.04em; line-height: 1.15; margin-top: 12px; white-space: nowrap; text-shadow: 0 10px 40px rgba(0, 0, 0, 0.25); }
  .win-name::after { content: ''; display: block; height: 14px; width: 60%; margin: 18px auto 0; border-radius: 7px; background: var(--gold); }
  .win-hint { margin-top: 56px; font-size: 28px; font-weight: 600; opacity: 0.7; }

  /* ── 마무리 ── */
  .end { background: radial-gradient(circle at 85% 10%, #3d77ff 0%, transparent 50%), linear-gradient(150deg, var(--b-blue), var(--b-navy)); color: #fff; justify-content: center; padding: 0 140px; }
  .end .eyebrow { color: rgba(255, 255, 255, 0.85); }
  .end h1 { font-size: 150px; font-weight: 900; line-height: 1.12; letter-spacing: -0.04em; margin: 34px 0 0; }
  .end-winners { margin-top: 80px; }
  .end-winners > span { display: block; font-size: 32px; font-weight: 800; color: var(--gold); margin-bottom: 22px; }
  .end-winners .chip { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.28); color: #fff; }

  /* ── 진행 도구 막대 ── */
  #dock {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 50;
    display: flex; align-items: center; gap: 6px; padding: 8px; border-radius: 16px;
    background: rgba(8, 20, 60, 0.92); color: #fff; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    opacity: 0; transition: opacity 0.3s; font-size: 14px;
  }
  body.dock-on #dock, #dock:hover { opacity: 1; }
  #dock button { border: 0; background: transparent; color: #fff; height: 40px; min-width: 40px; padding: 0 12px; border-radius: 10px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
  #dock button:hover { background: rgba(255, 255, 255, 0.12); }
  #dock button:disabled { opacity: 0.3; background: transparent; }
  #dock .label { min-width: 120px; text-align: center; font-weight: 700; }
  #dock .sep { width: 1px; height: 22px; background: rgba(255, 255, 255, 0.2); margin: 0 4px; }
  #dock .conn { width: 8px; height: 8px; border-radius: 50%; background: #3ddc84; margin: 0 8px 0 6px; }
  #dock .conn.off { background: #ff5a6e; }
  #dock svg { width: 18px; height: 18px; }

  /* ── 대화상자 ── */
  dialog { border: 0; padding: 0; border-radius: 24px; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35); color: var(--ink); }
  dialog::backdrop { background: rgba(5, 15, 51, 0.6); backdrop-filter: blur(4px); }
  #login { width: min(420px, calc(100vw - 32px)); }
  #login form { padding: 32px; display: flex; flex-direction: column; gap: 14px; }
  #login h2 { margin: 0; font-size: 22px; }
  #login p { margin: 0 0 6px; color: var(--ink-2); font-size: 15px; line-height: 1.5; }
  #login .err { color: var(--danger); font-size: 14px; min-height: 20px; margin: 0; }

  #settings { width: min(920px, calc(100vw - 32px)); max-height: calc(100vh - 48px); }
  #settings .sheet { display: flex; flex-direction: column; max-height: calc(100vh - 48px); }
  #settings header { display: flex; align-items: center; gap: 12px; padding: 20px 24px; border-bottom: 1px solid var(--line); }
  #settings header h2 { margin: 0; font-size: 20px; flex: 1; }
  #settings .tabs { display: flex; gap: 4px; padding: 10px 24px 0; border-bottom: 1px solid var(--line); }
  #settings .tabs button { border: 0; background: transparent; padding: 10px 14px; font-weight: 700; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; }
  #settings .tabs button.on { color: var(--b-blue); border-color: var(--b-blue); }
  #settings .body { overflow: auto; padding: 20px 24px 28px; background: var(--page); flex: 1; }
  #settings footer { padding: 14px 24px; border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
  #settings footer:empty { display: none; }
  #settings footer .note { flex: 1; font-size: 13px; color: var(--muted); }
  .warn { background: #fff7e0; color: #7a5600; border-radius: 12px; padding: 10px 14px; font-size: 14px; margin-bottom: 16px; line-height: 1.5; }
  .qe { background: #fff; border-radius: 16px; padding: 16px; box-shadow: var(--shadow); margin-bottom: 14px; display: flex; flex-direction: column; gap: 10px; }
  .qe-head { display: flex; align-items: center; gap: 8px; }
  .qe-head b { font-size: 16px; color: var(--b-blue); margin-right: auto; }
  .qe-head button { border: 0; background: var(--b-sky); color: var(--b-blue-700); border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: 700; }
  .qe-head button.del { background: #fff0f2; color: var(--danger); }
  .qe textarea { resize: vertical; min-height: 60px; line-height: 1.5; }
  .qe-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .qe-opt { display: flex; align-items: center; gap: 8px; border-radius: 12px; }
  .qe-opt input[type=radio] { width: 20px; height: 20px; accent-color: var(--b-blue); flex: none; margin: 0 2px 0 4px; }
  .qe-opt .field { padding: 10px 12px; }
  .qe-opt.ans .field { border-color: var(--b-blue); background: var(--b-sky); }
  .qe small { color: var(--muted); font-size: 12px; }
  .set-section { background: #fff; border-radius: 16px; padding: 18px; box-shadow: var(--shadow); margin-bottom: 14px; }
  .set-section h3 { margin: 0 0 12px; font-size: 16px; }
  .set-section p { margin: 0 0 12px; font-size: 14px; color: var(--ink-2); line-height: 1.5; }
  .set-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .set-row .field { flex: 1; min-width: 200px; }
  .plist { display: flex; flex-wrap: wrap; gap: 6px; max-height: 260px; overflow: auto; }
  .plist span { display: inline-flex; align-items: center; gap: 4px; background: var(--b-sky); border-radius: 999px; padding: 4px 6px 4px 12px; font-size: 14px; font-weight: 600; }
  .plist span.demo { background: #f0f2f7; color: var(--muted); }
  .plist button { border: 0; background: transparent; color: var(--muted); width: 22px; height: 22px; border-radius: 50%; font-size: 14px; line-height: 1; }
  .plist button:hover { background: #fff; color: var(--danger); }
  .linkbox { font-size: 14px; word-break: break-all; background: var(--page); border-radius: 10px; padding: 10px 12px; }
  #askBadge { margin-left: 6px; background: var(--b-blue); color: #fff; border-radius: 999px; font-size: 12px; padding: 1px 7px; }
  #askBadge[hidden] { display: none; }
  .set-row .linkbox { flex: 1; min-width: 240px; }
  .ask-state { display: inline-block; margin-left: 8px; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; background: #fff0f2; color: var(--danger); vertical-align: 1px; }
  .ask-state.on { background: var(--b-sky); color: var(--b-blue-700); }
  .ask-filter { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 14px; }
  .ask-filter button { border: 0; background: #fff; color: var(--ink-2); border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 700; box-shadow: var(--shadow); }
  .ask-filter button.on { background: var(--b-blue); color: #fff; }
  .ask { background: #fff; border-radius: 16px; padding: 16px; box-shadow: var(--shadow); margin-bottom: 12px; display: flex; flex-direction: column; gap: 10px; }
  .ask-head { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .ask-head b { color: var(--ink); font-size: 14px; }
  .ask-head .ask-no { display: grid; place-items: center; min-width: 24px; height: 24px; border-radius: 8px; background: var(--b-blue); color: #fff; font-size: 13px; }
  .ask-head em { margin-left: auto; font-style: normal; font-weight: 700; color: var(--b-blue-700); background: var(--b-sky); border-radius: 999px; padding: 2px 10px; }
  .ask-body { margin: 0; font-size: 16px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
  .ask textarea { resize: vertical; min-height: 64px; font-size: 14px; line-height: 1.5; }
  .ask-actions { display: flex; flex-wrap: wrap; gap: 6px; }
  .ask-actions button { border: 0; background: var(--b-sky); color: var(--b-blue-700); border-radius: 8px; padding: 7px 12px; font-size: 13px; font-weight: 700; }
  .ask-actions button:disabled { opacity: 0.35; cursor: default; }
  .ask-actions button.del { margin-left: auto; background: #fff0f2; color: var(--danger); }
  .ask-empty { margin: 0; padding: 32px 16px; text-align: center; color: var(--muted); font-size: 15px; }
  @media (max-width: 600px) {
    #settings .tabs { flex: none; flex-wrap: wrap; padding-left: 12px; padding-right: 12px; }
    #settings .body { padding-left: 14px; padding-right: 14px; }
    #settings footer { flex-wrap: wrap; }
    #settings footer .note { flex-basis: 100%; }
  }
</style>
</head>
<body class="host">
<div id="stage"></div>

<nav id="dock" aria-label="진행 도구">
  <span class="conn" id="conn" title="연결 상태"></span>
  <button id="prevBtn" title="이전 (←)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
  <span class="label" id="stepLabel">-</span>
  <button id="nextBtn" title="다음 (→)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
  <span class="sep"></span>
  <button id="fsBtn" title="전체화면 (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>전체화면</button>
  <button id="setBtn" title="설정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>설정</button>
</nav>

<dialog id="login">
  <form method="dialog" id="loginForm">
    <h2>진행자 로그인</h2>
    <p>관리자 PIN을 입력하면 진행 화면이 열립니다. 이 기기에 기억되니 행사 당일에는 다시 입력하지 않아도 돼요.</p>
    <input class="field" id="pinInput" type="password" inputmode="numeric" autocomplete="current-password" placeholder="관리자 PIN" required>
    <p class="err" id="loginErr"></p>
    <button class="btn" type="submit">진행 시작</button>
  </form>
</dialog>

<dialog id="settings">
  <div class="sheet">
    <header>
      <h2>행사 설정</h2>
      <button class="btn ghost" id="closeSettings" type="button">닫기</button>
    </header>
    <nav class="tabs" id="tabs">
      <button data-tab="questions" class="on">문제</button>
      <button data-tab="event">행사 정보</button>
      <button data-tab="people">참여자·초기화</button>
      <button data-tab="asks">조합원 질문<span id="askBadge" hidden></span></button>
      <button data-tab="security">PIN</button>
    </nav>
    <div class="body" id="settingsBody"></div>
    <footer id="settingsFoot"></footer>
  </div>
</dialog>

<div class="toast" id="toast" popover="manual"></div>

<script type="module">
import { rpc, escapeHtml as h } from './assets/api.js';

const PIN_KEY = 'hq2quiz.pin';
const DRAW_KEY = 'hq2quiz.draw';
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};

const stageEl = document.getElementById('stage');
const joinUrl = new URL('./', location.href).href;
const joinUrlText = joinUrl.replace(/^https?:\/\//, '').replace(/\/$/, '');
const askUrl = new URL('./ask.html', location.href).href;

let pin = store.get(PIN_KEY) || '';
let status = null;
let questions = [];
let steps = [];
let stepIdx = 0;
let renderedKey = null;
let navBusy = false;
let navSeq = 0;
let drawing = false;
let overlayOpen = false;
let seenIds = new Set();
let voterSeen = new Set();
let arenaSig = '';
const drawPref = JSON.parse(store.get(DRAW_KEY) || '{"mode":"all","k":7}');

// ───────── 공통 ─────────
function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  stageEl.style.setProperty('--s', s);
}
addEventListener('resize', fit);
fit();

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  // 설정 창 위에도 보이도록 매번 맨 위 층으로 다시 띄운다
  try { el.hidePopover(); el.showPopover(); } catch {}
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

function qrSvg(text, fg = '#0b1f5b') {
  if (!window.qrcode) return '';
  const qr = qrcode(0, 'M');
  qr.addData(text);
  qr.make();
  const n = qr.getModuleCount();
  const m = 2;
  let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${c + m},${r + m}h1v1h-1z`;
  const s = n + m * 2;
  return `<svg viewBox="0 0 ${s} ${s}" shape-rendering="crispEdges" aria-label="참여 QR 코드"><rect width="${s}" height="${s}" fill="#fff"/><path d="${d}" fill="${fg}"/></svg>`;
}

const CHECK = '<svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10.5" stroke-width="2"/><path d="M7 12.5l3.2 3.2L17 9"/></svg>';
const pad2 = (n) => String(n).padStart(2, '0');
const rand = (a, b) => a + Math.random() * (b - a);
const total = () => questions.length;

// ───────── 단계 ─────────
function buildSteps(n) {
  const list = [{ stage: 'cover' }];
  for (let i = 1; i <= n; i++) {
    list.push({ stage: 'q', qno: i, revealed: false });
    list.push({ stage: 'q', qno: i, revealed: true });
    list.push({ stage: 'qdraw', qno: i });
  }
  list.push({ stage: 'result' }, { stage: 'draw' }, { stage: 'end' });
  return list;
}
function indexOfState(s) {
  const i = steps.findIndex((st) => st.stage === s.stage && (st.qno || 0) === (s.qno || 0)
    && (st.stage !== 'q' || st.revealed === s.revealed));
  return i < 0 ? 0 : i;
}
function stepName(st) {
  if (!st) return '-';
  if (st.stage === 'qdraw') return `Q${st.qno} 정답자 추첨`;
  return { cover: '표지 · QR', result: '퀴즈 결과', draw: '경품 추첨', end: '마무리' }[st.stage]
    || `Q${st.qno} ${st.revealed ? '정답 공개' : '응답 받는 중'}`;
}

// ───────── 데이터 ─────────
async function loadQuestions() {
  questions = await rpc('quiz_admin_questions', { p_pin: pin });
  steps = buildSteps(questions.length);
  renderedKey = null;
}

let pollTimer;
async function refresh() {
  clearTimeout(pollTimer);
  const seq = navSeq;
  try {
    const s = await rpc('quiz_admin_status', { p_pin: pin });
    setConn(true);
    if (s.state.total !== questions.length) await loadQuestions();
    status = s;
    if (!navBusy && seq === navSeq) stepIdx = indexOfState(s.state);
    render();
  } catch (e) {
    if (e.code === 'invalid_pin') { showLogin(); return; }
    setConn(false);
  }
  pollTimer = setTimeout(refresh, 1500);
}
function setConn(ok) {
  const el = document.getElementById('conn');
  el.classList.toggle('off', !ok);
  el.title = ok ? '연결됨' : '연결이 끊겼어요. 다시 연결 중…';
}

async function go(idx) {
  if (navBusy || drawing || idx < 0 || idx >= steps.length) return;
  if (overlayOpen) closeOverlay();
  const prev = stepIdx;
  const st = steps[idx];
  stepIdx = idx;
  navBusy = true;
  navSeq++;
  render();
  try {
    await rpc('quiz_admin_set_state', { p_pin: pin, p_stage: st.stage, p_qno: st.qno || 0, p_revealed: !!st.revealed });
  } catch (e) {
    stepIdx = prev;
    render();
    toast(e.message);
  } finally {
    navBusy = false;
    navSeq++;
    refresh();
  }
}
function next() {
  const st = steps[stepIdx];
  if (st?.stage === 'draw' || st?.stage === 'qdraw') {
    if (overlayOpen) { closeOverlay(); return; }
    if (drawing) return;
    // 문제 정답자 추첨은 한 명 뽑았거나 뽑을 사람이 없으면 다음 화면으로 넘어간다
    const done = st.stage === 'qdraw' && (qWinners(st).length > 0 || drawPool(st).length === 0);
    if (!done) { startDraw(); return; }
  }
  go(stepIdx + 1);
}
function prev() {
  if (overlayOpen) { closeOverlay(); return; }
  go(stepIdx - 1);
}

// ───────── 화면 그리기 ─────────
function render() {
  const st = steps[stepIdx];
  if (!st || !status) return;
  document.getElementById('stepLabel').textContent = stepName(st);
  document.getElementById('prevBtn').disabled = stepIdx === 0;
  document.getElementById('nextBtn').disabled = stepIdx === steps.length - 1;
  const key = st.stage + (st.qno || '');
  if (key !== renderedKey) {
    renderedKey = key;
    arenaSig = '';
    overlayOpen = false;
    stageEl.innerHTML = VIEWS[st.stage].html(st);
    VIEWS[st.stage].mount?.(st);
  }
  VIEWS[st.stage].update(st);
}

const VIEWS = {
  cover: {
    html: () => `
      <section class="slide cover">
        <div class="cover-left">
          <div class="eyebrow"><span class="dot"></span>실시간 참여 퀴즈</div>
          <h1 class="cover-title" data-title></h1>
          <p class="cover-sub" data-subtitle></p>
          <ol class="steps">
            <li><b>1</b><span>카메라로<br>QR 스캔</span></li>
            <li><b>2</b><span>참여 아이디<br>입력</span></li>
            <li><b>3</b><span>퀴즈 풀고<br>경품 추첨!</span></li>
          </ol>
          <div class="joined">
            <div class="joined-count"><strong data-count>0</strong>명 참여 중</div>
            <div class="chips" data-chips></div>
          </div>
        </div>
        <div class="cover-right">
          <div class="qr-card"><div class="qr">${qrSvg(joinUrl)}</div></div>
          <div class="qr-caption"><b>QR을 찍고 참여하세요</b><span>${h(joinUrlText)}</span></div>
        </div>
      </section>`,
    mount() {
      seenIds = new Set((status?.participants || []).map((p) => p.id));
    },
    update() {
      const root = stageEl.querySelector('.cover');
      root.querySelector('[data-title]').textContent = status.state.title;
      root.querySelector('[data-subtitle]').textContent = status.state.subtitle;
      const ps = status.participants;
      root.querySelector('[data-count]').textContent = ps.length;
      const shown = ps.slice(-28).reverse();
      const rest = ps.length - shown.length;
      root.querySelector('[data-chips]').innerHTML =
        shown.map((p) => `<span class="chip${seenIds.has(p.id) ? '' : ' new'}">${h(p.nickname)}</span>`).join('') +
        (rest > 0 ? `<span class="chip more">외 ${rest}명</span>` : '');
      ps.forEach((p) => seenIds.add(p.id));
    },
  },

  q: {
    html(st) {
      const q = questions.find((x) => x.no === st.qno) || { question: '', options: [], answer: -1, explanation: '' };
      const len = q.question.length;
      const size = len > 80 ? 'sm' : len > 40 ? 'md' : '';
      const short = q.options.every((o) => o.length <= 2);
      return `
        <section class="slide question">
          <header class="q-head">
            <div class="q-badge">Q<span>${pad2(st.qno)}</span></div>
            <div class="q-of">/ ${pad2(total())}</div>
            <div class="q-progress">${questions.map((x) => `<i class="${x.no < st.qno ? 'done' : x.no === st.qno ? 'now' : ''}"></i>`).join('')}</div>
            <div class="mini-qr"><div class="qr">${qrSvg(joinUrl)}</div><span>지금도<br>참여 가능</span></div>
          </header>
          <h2 class="q-text ${size}">${h(q.question)}</h2>
          <div class="options n${q.options.length}${short ? ' short' : ''}">
            ${q.options.map((o, i) => `
              <div class="opt${i === q.answer ? ' correct' : ''}" data-i="${i}">
                <i class="fill"></i>
                <span class="num">${i + 1}</span>
                <span class="label">${h(o)}</span>
                <span class="stat" data-stat></span>
                ${CHECK}
              </div>`).join('')}
          </div>
          <div class="explain${q.explanation ? ' has' : ''}">${h(q.explanation)}</div>
          <div class="voters" data-voters></div>
          <footer class="q-foot">
            <span class="live"><i></i><span data-live></span></span>
            <div class="answered"><span><b data-ans>0</b> / <span data-total>0</span>명 응답</span><div class="meter"><i data-meter></i></div></div>
            <div class="key-hint" data-hint></div>
          </footer>
        </section>`;
    },
    mount(st) {
      const cur = status.current && status.current.no === st.qno ? status.current : null;
      voterSeen = new Set((cur?.answers || []).map((a) => a.id));
    },
    update(st) {
      const root = stageEl.querySelector('.question');
      root.classList.toggle('revealed', !!st.revealed);
      const cur = status.current && status.current.no === st.qno ? status.current : null;
      const counts = cur ? cur.counts : [];
      const answered = counts.reduce((a, b) => a + b, 0);
      const people = status.participants.length;
      root.querySelector('[data-live]').textContent = st.revealed ? '정답 공개' : '응답 받는 중';
      root.querySelector('[data-ans]').textContent = answered;
      root.querySelector('[data-total]').textContent = people;
      root.querySelector('[data-meter]').style.width = people ? `${Math.min(100, (answered / people) * 100)}%` : '0';
      root.querySelector('[data-hint]').innerHTML = st.revealed ? '<kbd>→</kbd>정답자 추첨' : '<kbd>→</kbd>정답 공개';
      root.querySelectorAll('.opt').forEach((el, i) => {
        const c = counts[i] || 0;
        const pct = answered ? Math.round((c / answered) * 100) : 0;
        el.style.setProperty('--pct', `${pct}%`);
        el.querySelector('[data-stat]').textContent = `${c}명 · ${pct}%`;
      });
      renderVoters(root.querySelector('[data-voters]'), cur ? cur.answers || [] : [], st.revealed && cur ? cur.answer : null);
    },
  },

  result: {
    html: () => `
      <section class="slide result">
        <h2 class="title">퀴즈 결과</h2>
        <div class="result-grid">
          <div class="tiles">
            <div class="tile"><span>참여자</span><b data-people>0</b></div>
            <div class="tile"><span>평균 정답</span><b data-avg>0</b></div>
            <div class="tile accent"><span>만점자</span><b data-perfect>0</b></div>
          </div>
          <div class="chart-card"><h3>정답 개수별 인원</h3><svg data-chart viewBox="0 0 1080 560" role="img" aria-label="정답 개수별 인원 막대그래프"></svg></div>
        </div>
        <div class="perfect"><span>만점자</span><div class="chips" data-perfect-list></div></div>
      </section>`,
    update() {
      const root = stageEl.querySelector('.result');
      const ps = status.participants;
      const n = total();
      const dist = Array.from({ length: n + 1 }, () => 0);
      ps.forEach((p) => { dist[Math.min(p.score, n)]++; });
      const perfect = ps.filter((p) => p.score === n);
      const avg = ps.length ? ps.reduce((a, p) => a + p.score, 0) / ps.length : 0;
      root.querySelector('[data-people]').innerHTML = `${ps.length}<small>명</small>`;
      root.querySelector('[data-avg]').innerHTML = `${avg.toFixed(1)}<small>개</small>`;
      root.querySelector('[data-perfect]').innerHTML = `${perfect.length}<small>명</small>`;
      root.querySelector('[data-perfect-list]').innerHTML = perfect.length

VIEWS.qdraw = VIEWS.draw;

function currentOf(st) {
  return status.current && status.current.no === st.qno ? status.current : null;
}
function qWinners(st) {
  return status.winners.filter((w) => w.qno === st.qno);
}
// 추첨 후보: 문제 정답자 추첨이면 그 문제를 맞힌 사람, 아니면 고른 조건의 참여자 (이미 당첨된 사람 제외)
function drawPool(st) {
  if (st.stage === 'qdraw') {
    const cur = currentOf(st);
    if (!cur) return [];
    const won = new Set(status.participants.filter((p) => p.won).map((p) => p.id));
    return cur.answers.filter((a) => a.choice === cur.answer && !won.has(a.id));
  }
  const ps = status.participants.filter((p) => !p.won);
  return drawPref.mode === 'all' ? ps : ps.filter((p) => p.score >= drawPref.k);
}

// 응답한 사람 아이디: 응답 중에는 최근 순, 정답 공개 뒤에는 맞힌 사람(파랑) 먼저
function renderVoters(el, answers, answer) {
  const list = answer == null
    ? [...answers].reverse()
    : [...answers.filter((a) => a.choice === answer), ...answers.filter((a) => a.choice !== answer)];
  const sig = `${answer}|${list.map((a) => a.id).join()}`;
  if (el.dataset.sig === sig) return;
  el.dataset.sig = sig;
  const cls = (a) => (answer == null ? (voterSeen.has(a.id) ? '' : ' new') : a.choice === answer ? ' ok' : ' no');
  const shown = list.slice(0, 80);
  el.innerHTML = shown.map((a) => `<span class="chip${cls(a)}">${h(a.nickname)}</span>`).join('')
    + '<span class="chip more" hidden></span>';
  answers.forEach((a) => voterSeen.add(a.id));
  fitChips(el, list.length - shown.length);
}

// 정답자 추첨 전 화면의 정답자 아이디 (사람 수에 따라 글자 크기를 맞춘다)
function renderRoster(el, pool) {
  const sig = pool.map((p) => p.id).join();
  if (el.dataset.sig === sig) return;
  el.dataset.sig = sig;
  const n = pool.length;
  el.style.setProperty('--fs', `${n <= 8 ? 64 : n <= 20 ? 48 : n <= 50 ? 36 : 28}px`);
  const shown = pool.slice(0, 200);
  el.innerHTML = shown.map((p) => `<span class="chip">${h(p.nickname)}</span>`).join('') + '<span class="chip more" hidden></span>';
  fitChips(el, n - shown.length);
}

// 칸에 다 안 들어가면 뒤쪽 아이디를 '외 N명'으로 묶는다 (마지막 칸이 '외 N명' 자리)
function fitChips(el, rest) {
  const more = el.lastElementChild;
  const chips = [...el.children].slice(0, -1);
  const setMore = () => { more.hidden = rest === 0; more.textContent = `외 ${rest}명`; };
  setMore();
  while (chips.length && el.scrollHeight > el.clientHeight + 1) {
    chips.pop().remove();
    rest++;
    setMore();
  }
}

function barChart(dist) {
  const W = 1080, H = 560, L = 64, R = 16, T = 40, B = 64;
  const max = Math.max(1, ...dist);
  const niceMax = max <= 5 ? max : Math.ceil(max / 5) * 5;
  const n = dist.length;
  const slot = (W - L - R) / n;
  const bw = Math.min(64, slot * 0.62);
  const y = (v) => T + (H - T - B) * (1 - v / niceMax);
  const ticks = [0, 0.5, 1].map((f) => Math.round(niceMax * f));
  let out = '';
  [...new Set(ticks)].forEach((t) => {
    out += `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="#e3e9f5" stroke-width="2"/>`;
    out += `<text x="${L - 14}" y="${y(t) + 9}" text-anchor="end" font-size="24" font-weight="600" fill="#7b88a6">${t}</text>`;
  });
  dist.forEach((v, i) => {
    const cx = L + slot * i + slot / 2;
    const top = y(v);
    const hgt = H - B - top;
    if (v > 0) {
      const r = Math.min(4, hgt);
      out += `<path d="M${cx - bw / 2},${H - B} V${top + r} Q${cx - bw / 2},${top} ${cx - bw / 2 + r},${top} H${cx + bw / 2 - r} Q${cx + bw / 2},${top} ${cx + bw / 2},${top + r} V${H - B} Z" fill="${i === n - 1 ? '#0b1f5b' : '#1d57e6'}"><title>${i}개 정답: ${v}명</title></path>`;
      out += `<text x="${cx}" y="${top - 12}" text-anchor="middle" font-size="28" font-weight="800" fill="#0e1a3a">${v}</text>`;
    }
    out += `<text x="${cx}" y="${H - B + 42}" text-anchor="middle" font-size="24" font-weight="700" fill="#44516f">${i}개</text>`;
  });
  return out;
}

// ───────── 추첨 연출 ─────────
function chipEls(names) {
  const arena = stageEl.querySelector('[data-arena]');
  arena.innerHTML = names.map((n) => `<span class="chip">${h(n)}</span>`).join('');
  return [...arena.children].map((el) => ({ el, w: el.offsetWidth, h: el.offsetHeight }));
}
function scatter(chips) {
  chips.forEach((c) => {
    c.el.style.transform = `translate(${rand(30, 1890 - c.w)}px, ${rand(150, 1050 - c.h)}px)`;
  });
}
function idleArena(names) {
  const arena = stageEl.querySelector('[data-arena]');
  if (!arena) return;
  arena.className = 'arena idle';
  const pick = [...names].sort(() => Math.random() - 0.5).slice(0, 40);
  const chips = chipEls(pick);
  chips.forEach((c) => { c.el.style.animationDelay = `${-rand(0, 6)}s`; });
  scatter(chips);
}
function fitName(el, name, base, width) {
  el.style.fontSize = `${Math.min(base, Math.floor(width / Math.max(1, name.length) / 0.95))}px`;
}

async function removeWinner(id) {
  try {
    await rpc('quiz_admin_remove_winner', { p_pin: pin, p_winner_id: id });
    refresh();
  } catch (err) { toast(err.message); }
}

async function startDraw() {
  const st = steps[stepIdx];
  const qd = st.stage === 'qdraw';
  if (!drawPool(st).length) {
    toast(qd ? '추첨할 정답자가 없어요.' : '추첨 대상이 없어요. 대상 조건을 바꿔 보세요.');
    return;
  }
  drawing = true;
  let res;
  try {
    res = await rpc('quiz_admin_draw', qd
      ? { p_pin: pin, p_qno: st.qno }
      : { p_pin: pin, p_min_score: drawPref.mode === 'all' ? 0 : drawPref.k });
  } catch (e) {
    drawing = false;
    toast(e.message);
    return;
  }
  if (!res.winner) {
    drawing = false;
    toast('추첨 대상이 없어요.');
    refresh();
    return;
  }
  await roulette(res.pool || [], res.winner.nickname, res.pool_size);
  showWinner(res.winner);
  drawing = false;
  refresh();
  // 당첨자 휴대폰이 연출이 끝나자마자 당첨 화면으로 바뀌도록 실시간 알림을 보낸다
  setTimeout(() => rpc('quiz_admin_touch', { p_pin: pin }).catch(() => {}), 900);
}

// 룰렛: 참여자 아이디가 적힌 판이 3.5초 동안 빠르게 돌고, 마지막 3초는 칸을 넘길 때마다 점점 더 느려진다.
// 바늘은 판 오른쪽에서 칸 사이 못에 걸려 휘었다가 풀리며 튕기고, 바늘이 가리키는 아이디는
// 오른쪽 이름판에 크게 보여 준다. 멈춘 칸과 이름판이 금색으로 빛나면 당첨 (약 7초)
const WHEEL_COLORS = [
  { fill: '#1d57e6', text: '#fff' },
  { fill: '#ffffff', text: '#0b1f5b' },
  { fill: '#0b1f5b', text: '#fff' },
  { fill: '#dbe6ff', text: '#0b1f5b' },
];
const WHEEL_GOLD = { fill: '#ffcf3f', text: '#0b1f5b' };
const CANVAS_FONT = "'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif";

function wheelImage(names, colors, R, k) {
  const c = document.createElement('canvas');
  c.width = c.height = Math.ceil(R * 2 * k);
  const g = c.getContext('2d');
  g.scale(k, k);
  g.translate(R, R);
  const n = names.length;
  const seg = (Math.PI * 2) / n;
  const outer = R * 0.93;
  const maxW = outer - R * 0.3;
  const base = Math.min(52, ((Math.PI * 2 * R * 0.62) / n) * 0.62);
  names.forEach((name, i) => {
    g.fillStyle = colors[i].fill;
    g.beginPath();
    g.moveTo(0, 0);
    g.arc(0, 0, R, i * seg, (i + 1) * seg);
    g.closePath();
    g.fill();
    // 이름은 칸 크기에 맞춰 줄이고, 그래도 길면 말줄임
    g.save();
    g.rotate((i + 0.5) * seg);
    let size = base;
    let text = name;
    g.font = `800 ${size}px ${CANVAS_FONT}`;
    const w = g.measureText(text).width;
    if (w > maxW) {
      size = Math.max(16, (size * maxW) / w);
      g.font = `800 ${size}px ${CANVAS_FONT}`;
    }
    while (g.measureText(text).width > maxW && text.length > 2) text = `${text.slice(0, -2)}…`;
    g.fillStyle = colors[i].text;
    g.textAlign = 'right';
    g.textBaseline = 'middle';
    g.fillText(text, outer, 0);
    g.restore();
  });
  if (n > 1) {
    g.strokeStyle = 'rgba(11, 31, 91, 0.2)';
    g.lineWidth = 2;
    for (let i = 0; i < n; i++) {
      g.beginPath();
      g.moveTo(0, 0);
      g.lineTo(Math.cos(i * seg) * R, Math.sin(i * seg) * R);
      g.stroke();
    }
  }
  return c;
}

function roulette(pool, winner, poolSize) {
  const root = stageEl.querySelector('.draw');
  const cv = root.querySelector('[data-wheel]');
  const k = Math.min(2, Math.max(1, (devicePixelRatio || 1) * (stageEl.getBoundingClientRect().width / 1920)));
  cv.width = 1920 * k;
  cv.height = 1080 * k;
  const ctx = cv.getContext('2d');
  cv.hidden = false;
  root.classList.add('wheel-on');

  const CX = 640, CY = 590, R = 400, RIM = 30, BULBS = 32;
  const PX = 1500, PY = 590, PW = 640, PH = 300; // 이름판
  const PTR = 0; // 바늘 방향 (판 오른쪽): 이 자리의 아이디가 가로로 읽힌다
  const TAU = Math.PI * 2;
  // 칸이 많으면 글자가 작아지므로 판에는 최대 20명 (당첨자 포함 무작위)
  const names = [winner, ...pool.filter((n) => n !== winner).slice(0, 19)].sort(() => Math.random() - 0.5);
  const n = names.length;
  const seg = TAU / n;
  const w = names.indexOf(winner);
  // 이웃한 칸끼리 같은 색이 되지 않게 (마지막 칸과 첫 칸도 이웃)
  const colors = names.map((_, i) => WHEEL_COLORS[n > 1 && n % 4 === 1 && i === n - 1 ? 2 : i % 4]);
  const plain = wheelImage(names, colors, R, k);
  const lit = wheelImage(names, colors.map((c, i) => (i === w ? WHEEL_GOLD : c)), R, k);

  // 바늘이 멈추는 곳: 당첨 칸에 겨우 넘어 들어왔거나, 다음 칸으로 넘어갈 듯 말 듯 걸린 곳
  const FAST = 3500, SLOW = 3000, SPIN = FAST + SLOW, END = SPIN + 700;
  const th0 = rand(0, TAU);
  const f = Math.random() < 0.5 ? rand(0.76, 0.9) : rand(0.1, 0.22);
  const target = PTR - (w + f) * seg;
  const thEnd = th0 + TAU * 5 + ((((target - th0) % TAU) + TAU) % TAU);
  // 마지막 3초에 4~5칸만 지나가도록 나누고, 두 구간의 속도가 끊김 없이 이어지게 한다
  const dSlow = Math.min(4.5 * seg, 2.6);
  const dFast = thEnd - th0 - dSlow;
  const Ta = FAST / 1000;
  const wB = (3 * dSlow) / (SLOW / 1000);
  const wA = wB + (3 * (dFast - wB * Ta)) / Ta;
  const angleAt = (t) => {
    if (t <= FAST) {
      const sec = t / 1000;
      return th0 + wB * sec + ((wA - wB) * Ta / 3) * (1 - (1 - sec / Ta) ** 3);
    }
    const u = Math.min(1, (t - FAST) / SLOW);
    return th0 + dFast + dSlow * (1 - (1 - u) ** 3);
  };
  // 바늘 아래 칸 위치 (정수 부분 = 칸 번호, 소수 부분이 0에 가까울수록 다음 못에 닿는다)
  const posAt = (th) => ((((PTR - th) % TAU) + TAU) % TAU) / seg;

  const draw = (t, th, needle, cur, pop) => {
    ctx.setTransform(k, 0, 0, k, 0, 0);
    ctx.clearRect(0, 0, 1920, 1080);
    const stopped = t >= SPIN;
    // 테두리 (그림자)
    ctx.save();
    ctx.shadowColor = 'rgba(11, 31, 91, 0.28)';
    ctx.shadowBlur = 50;
    ctx.shadowOffsetY = 20;
    ctx.fillStyle = '#0b1f5b';
    ctx.beginPath();
    ctx.arc(CX, CY, R + RIM, 0, TAU);
    ctx.fill();
    ctx.restore();
    // 판
    ctx.save();
    ctx.translate(CX, CY);
    ctx.rotate(th);
    ctx.drawImage(plain, -R, -R, R * 2, R * 2);
    if (stopped) {
      ctx.globalAlpha = Math.min(1, (t - SPIN) / 200);
      ctx.drawImage(lit, -R, -R, R * 2, R * 2);
    }
    ctx.restore();
    // 테두리 전구: 돌 때는 판을 따라 깜빡이고, 멈추면 다 같이 번쩍인다
    const phase = stopped ? Math.floor((t - SPIN) / 140) % 2 : Math.floor((th / TAU) * BULBS * 2) % 2;
    for (let i = 0; i < BULBS; i++) {
      const a = (i / BULBS) * TAU;
      const on = stopped ? phase === 0 : (i + phase) % 2 === 0;
      ctx.fillStyle = on ? '#ffcf3f' : '#3b4f8f';
      ctx.beginPath();
      ctx.arc(CX + Math.cos(a) * (R + RIM / 2), CY + Math.sin(a) * (R + RIM / 2), 6, 0, TAU);
      ctx.fill();
    }
    // 가운데 축
    const hub = ctx.createRadialGradient(CX - 20, CY - 24, 6, CX, CY, 78);
    hub.addColorStop(0, '#ffffff');
    hub.addColorStop(1, '#dbe6ff');
    ctx.fillStyle = hub;
    ctx.strokeStyle = '#0b1f5b';
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.arc(CX, CY, 74, 0, TAU);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#0b1f5b';
    ctx.font = `900 34px ${CANVAS_FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('추첨', CX, CY + 1);
    // 바늘: 칸을 넘길 때마다 판이 도는 쪽으로 튕긴다
    ctx.save();
    ctx.translate(CX + R + 44, CY);
    ctx.rotate(needle);
    ctx.shadowColor = 'rgba(11, 31, 91, 0.35)';
    ctx.shadowBlur = 12;
    ctx.shadowOffsetY = 4;
    ctx.fillStyle = '#ffcf3f';
    ctx.strokeStyle = '#0b1f5b';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(0, -30);
    ctx.lineTo(0, 30);
    ctx.lineTo(-78, 0);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.shadowColor = 'transparent';
    ctx.fillStyle = '#0b1f5b';
    ctx.beginPath();
    ctx.arc(0, 0, 14, 0, TAU);
    ctx.fill();
    ctx.restore();
    // 이름판: 바늘이 가리키는 아이디를 크게
    ctx.fillStyle = stopped ? '#d39b00' : '#1d57e6';
    ctx.font = `800 46px ${CANVAS_FONT}`;
    ctx.fillText(stopped ? '당첨!' : t < FAST ? '두구두구…' : '과연 누가…?', PX, PY - PH / 2 - 60);
    ctx.save();
    ctx.translate(PX, PY);
    ctx.scale(pop, pop);
    ctx.shadowColor = stopped ? 'rgba(255, 207, 63, 0.7)' : 'rgba(11, 31, 91, 0.18)';
    ctx.shadowBlur = stopped ? 70 : 40;
    ctx.shadowOffsetY = stopped ? 0 : 16;
    ctx.fillStyle = stopped ? '#ffcf3f' : '#ffffff';
    ctx.beginPath();
    ctx.roundRect(-PW / 2, -PH / 2, PW, PH, 40);
    ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.lineWidth = 6;
    ctx.strokeStyle = stopped ? '#d39b00' : '#b9cdfb';
    ctx.stroke();
    const name = names[cur] || '';
    let size = 130;
    ctx.font = `900 ${size}px ${CANVAS_FONT}`;
    const nw = ctx.measureText(name).width;
    if (nw > PW - 80) {
      size = (size * (PW - 80)) / nw;
      ctx.font = `900 ${size}px ${CANVAS_FONT}`;
    }
    ctx.fillStyle = '#0b1f5b';
    ctx.fillText(name, 0, 4);
    ctx.restore();
    // 추첨 대상 인원: 남색 알약 안에 숫자를 금색으로 크게
    const pre = '추첨 대상 ', num = String(poolSize), post = '명';
    const fLabel = `800 44px ${CANVAS_FONT}`, fNum = `900 64px ${CANVAS_FONT}`;
    ctx.font = fLabel;
    const wPre = ctx.measureText(pre).width, wPost = ctx.measureText(post).width;
    ctx.font = fNum;
    const wNum = ctx.measureText(num).width + 8;
    const bw = wPre + wNum + wPost + 72, by = PY + PH / 2 + 100;
    ctx.fillStyle = '#0b1f5b';
    ctx.beginPath();
    ctx.roundRect(PX - bw / 2, by - 50, bw, 100, 50);
    ctx.fill();
    let x = PX - bw / 2 + 36;
    ctx.textAlign = 'left';
    ctx.fillStyle = '#ffffff';
    ctx.font = fLabel;
    ctx.fillText(pre, x, by + 2);
    x += wPre;
    ctx.fillStyle = '#ffcf3f';
    ctx.font = fNum;
    ctx.fillText(num, x + 4, by + 2);
    x += wNum;
    ctx.fillStyle = '#ffffff';
    ctx.font = fLabel;
    ctx.fillText(post, x, by + 2);
    ctx.textAlign = 'center';
  };

  return new Promise((resolve) => {
    const t0 = performance.now();
    let last = t0, idx = Math.floor(posAt(th0)), osc = 0, oscV = 0, needle = 0, tick = -1e9;
    const frame = (now) => {
      const t = now - t0;
      const dt = Math.min(1 / 30, (now - last) / 1000);
      last = now;
      const th = angleAt(t);
      const pos = posAt(th);
      const cur = Math.floor(pos);
      // 못에 가까워질수록 바늘이 판이 도는 쪽으로 휘고, 못을 넘기면 풀리며 흔들린다
      const bend = Math.max(0, (0.3 - (pos - cur)) / 0.3);
      if (cur !== idx) { idx = cur; osc = needle; oscV = 0; tick = t; }
      oscV += (-300 * osc - 12 * oscV) * dt;
      osc += oscV * dt;
      needle = -0.38 * bend + osc;
      // 느려진 뒤에는 이름이 바뀔 때마다 이름판이 살짝 튀어 오른다
      const pop = t > FAST - 300 ? 1 + 0.07 * Math.exp(-(t - tick) / 120) : 1;
      draw(t, th, needle, cur, pop);
      if (t < END) requestAnimationFrame(frame);
      else resolve();
    };
    requestAnimationFrame(frame);
  });
}

function showWinner(w) {

function confetti(canvas) {
  const ctx = canvas.getContext('2d');
  const colors = ['#ffcf3f', '#ffffff', '#5b8cff', '#1d57e6', '#ffe58a', '#b9cdfb'];
  const parts = [];
  const burst = (x, y, dir, count) => {
    for (let i = 0; i < count; i++) {
      const a = (dir + rand(-0.55, 0.55));
      const sp = rand(14, 30);
      parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, w: rand(10, 22), h: rand(6, 12), r: rand(0, 6), vr: rand(-0.3, 0.3), c: colors[i % colors.length], life: rand(140, 220) });
    }
  };
  burst(0, 1080, -Math.PI / 3.2, 160);
  burst(1920, 1080, -Math.PI + Math.PI / 3.2, 160);
  setTimeout(() => burst(960, 1100, -Math.PI / 2, 140), 350);
  let frame = 0;
  const tick = () => {
    if (!canvas.isConnected) return;
    ctx.clearRect(0, 0, 1920, 1080);
    let alive = 0;
    parts.forEach((p) => {
      if (p.life-- <= 0) return;
      alive++;
      p.vx *= 0.985; p.vy = p.vy * 0.985 + 0.55; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.r);
      ctx.globalAlpha = Math.min(1, p.life / 40);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 2)));
      ctx.restore();
    });
    if (alive || frame++ < 30) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

document.getElementById('prevBtn').onclick = (e) => { e.currentTarget.blur(); prev(); };
document.getElementById('nextBtn').onclick = (e) => { e.currentTarget.blur(); go(stepIdx + 1); };
document.getElementById('fsBtn').onclick = (e) => { e.currentTarget.blur(); toggleFs(); };
document.getElementById('setBtn').onclick = (e) => { e.currentTarget.blur(); openSettings(); };
function toggleFs() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.();
}

addEventListener('keydown', (e) => {
  if (document.querySelector('dialog[open]')) return;
  if (e.target.closest?.('input, textarea, select')) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(k)) { e.preventDefault(); next(); }
  else if (['ArrowLeft', 'PageUp'].includes(k)) { e.preventDefault(); prev(); }
  else if (k === 'ArrowDown' || k === 'End') { e.preventDefault(); go(stepIdx + 1); }
  else if (k === 'ArrowUp' || k === 'Home') { e.preventDefault(); go(stepIdx - 1); }
  else if (k === 'f' || k === 'F') toggleFs();
});

const loginDlg = document.getElementById('login');
function showLogin(msg = '') {
  clearTimeout(pollTimer);
  document.getElementById('loginErr').textContent = msg;
  if (!loginDlg.open) loginDlg.showModal();
  document.getElementById('pinInput').focus();
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {

  const v = document.getElementById('pinInput').value.trim();
  try {
    await rpc('quiz_admin_login', { p_pin: v });
    pin = v;

async function start() {
  try {
    await loadQuestions();
  } catch (e) {
    if (e.code === 'invalid_pin') { showLogin(pin ? 'PIN이 바뀌었어요. 다시 입력해 주세요.' : ''); return; }
    toast(e.message);
    setTimeout(start, 3000);
    return;
  }
  refresh();
}

async function openSettings() {
  try {
    draft = (await rpc('quiz_admin_questions', { p_pin: pin })).map((q) => ({
      question: q.question,
      options: [...q.options, '', '', '', ''].slice(0, 4),

      explanation: q.explanation,

    await loadAsks();
  } catch (e) { toast(e.message); return; }
  setDlg.showModal();

}

  tab = b.dataset.tab;

async function loadAsks() {
  const r = await rpc('quiz_admin_asks', { p_pin: pin });
  asks = r.items;
  askOpen = r.open;
  const fresh = asks.filter((a) => a.status === 'new').length;
  const badge = document.getElementById('askBadge');
  badge.textContent = fresh;
  badge.hidden = !fresh;
}

// 답변 요청은 정한 순서대로, 나머지는 최근에 온 질문부터 보여 준다
function asksOf(filter) {
  if (filter === 'all') return asks;
  const list = asks.filter((a) => a.status === filter);
  if (filter !== 'pick') return list;
  return list.sort((x, y) => (x.sort_order ?? Infinity) - (y.sort_order ?? Infinity) || new Date(x.created_at) - new Date(y.created_at));
}

function askTime(s) {
  const d = new Date(s);
  const two = (n) => String(n).padStart(2, '0');
  return `${d.getMonth() + 1}월 ${d.getDate()}일 ${two(d.getHours())}:${two(d.getMinutes())}`;
}

function askCard(a, i, total) {
  const ordering = askFilter === 'pick';
  const label = { new: '새 질문', pick: '답변 요청', hold: '보류' }[a.status];
  return `
    <article class="ask" data-id="${a.id}">
      <div class="ask-head">
        ${ordering ? `<b class="ask-no">${i + 1}</b>` : ''}
        <b>${h(a.author || '익명')}</b>
        <span>${askTime(a.created_at)}</span>
        ${askFilter === 'all' ? `<em>${label}</em>` : ''}
      </div>
      <p class="ask-body">${h(a.body)}</p>
      ${a.status === 'pick' || a.edited ? `<textarea class="field" data-ask-edit maxlength="500" placeholder="위원장에게 전달할 문구로 다듬기 (비워 두면 원문 그대로 전달)">${h(a.edited)}</textarea>` : ''}
      <div class="ask-actions">
        ${ordering ? `
          <button type="button" data-act="ask-up" title="위로" ${i === 0 ? 'disabled' : ''}>▲</button>
          <button type="button" data-act="ask-down" title="아래로" ${i === total - 1 ? 'disabled' : ''}>▼</button>` : ''}
        ${a.status !== 'pick' ? '<button type="button" data-act="ask-pick">답변 요청</button>' : ''}
        ${a.status !== 'hold' ? '<button type="button" data-act="ask-hold">보류</button>' : ''}
        <button type="button" class="del" data-act="ask-del">삭제</button>
      </div>
    </article>`;
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    throw new Error('복사하지 못했어요. 직접 선택해서 복사해 주세요.');
  }
}

        <h3>리허설</h3>
        <p>테스트 참여자 30명을 만들고 모든 문제에 무작위로 답하게 해요. 추첨 연출을 미리 볼 때 쓰고, 행사 전에 꼭 '전체 초기화'를 눌러 지워주세요.</p>
        <button class="btn ghost" type="button" data-act="demo">테스트 참여자 30명 추가</button>
      </div>
      <div class="set-section">
        <h3>초기화</h3>
        <p>문제와 조합원 질문은 그대로 두고 기록만 지워요.</p>
        <div class="set-row">
          <button class="btn ghost" type="button" data-act="reset-winners">당첨 기록만 초기화</button>
          <button class="btn danger" type="button" data-act="reset-all">전체 초기화 (참여자·답변·당첨)</button>
        </div>
      </div>`;
    setFoot.innerHTML = '';
  } else if (tab === 'asks') {
    const list = asksOf(askFilter);
    const picks = asksOf('pick').length;
    const filters = [['new', '새 질문'], ['pick', '답변 요청'], ['hold', '보류'], ['all', '전체']];
    setBody.innerHTML = `
      <div class="warn">질문 원문이 보이는 화면이에요. 스크린에 띄운 상태라면 화면 공유를 끄고 정리하세요.</div>
      <div class="set-section">
        <h3>조합원에게 보낼 링크<span class="ask-state ${askOpen ? 'on' : ''}">${askOpen ? '접수 중' : '접수 마감'}</span></h3>
        <p>메일에 이 주소를 넣어 보내세요. 조합원은 로그인 없이 바로 질문을 남길 수 있어요.</p>
        <div class="set-row">
          <div class="linkbox"><a href="${h(askUrl)}" target="_blank" rel="noopener">${h(askUrl)}</a></div>
          <button class="btn ghost" type="button" data-act="ask-link">링크 복사</button>
          <button class="btn ghost" type="button" data-act="ask-toggle">${askOpen ? '접수 마감하기' : '접수 다시 열기'}</button>
        </div>
      </div>
      <div class="ask-filter">
        ${filters.map(([f, name]) => `<button type="button" data-act="ask-filter" data-f="${f}" class="${askFilter === f ? 'on' : ''}">${name} ${asksOf(f).length}</button>`).join('')}
      </div>
      ${list.map((a, i) => askCard(a, i, list.length)).join('') || `<p class="ask-empty">${asks.length ? '이 목록에는 질문이 없어요.' : '아직 접수된 질문이 없어요.'}</p>`}`;
    setFoot.innerHTML = `
      <span class="note">답변 요청 질문을 순서대로 복사해요.</span>
      <button class="btn ghost" type="button" data-act="ask-reload">새로고침</button>
      <button class="btn" type="button" data-act="ask-copy" ${picks ? '' : 'disabled'}>답변 요청 ${picks}개 복사</button>`;
  } else {
    setBody.innerHTML = `
      <div class="set-section">
        <h3>관리자 PIN 변경</h3>
        <p>6자 이상으로 정해주세요. 바꾸면 다른 기기에서는 새 PIN으로 다시 로그인해야 해요.</p>
        <div class="set-row"><input class="field" id="newPin" type="password" autocomplete="new-password" placeholder="새 PIN"><button class="btn" type="button" data-act="pin">변경</button></div>
      </div>
      <div class="set-section">
        <h3>이 기기에서 로그아웃</h3>
        <p>저장된 PIN을 이 브라우저에서 지워요.</p>
        <button class="btn ghost" type="button" data-act="logout">로그아웃</button>
      </div>`;
    setFoot.innerHTML = '';
  }
}

setBody.addEventListener('input', (e) => {
  const card = e.target.closest('.qe');
  if (!card) return;
  const q = draft[Number(card.dataset.i)];
  if (e.target.dataset.k) q[e.target.dataset.k] = e.target.value;
  if (e.target.dataset.opt != null) q.options[Number(e.target.dataset.opt)] = e.target.value;
  if (e.target.type === 'radio') {
    q.answer = Number(e.target.value);
    card.querySelectorAll('.qe-opt').forEach((l, j) => l.classList.toggle('ans', j === q.answer));
  }
});

// 다듬은 문구는 입력칸을 벗어날 때 저장한다
setBody.addEventListener('change', async (e) => {
  if (!e.target.matches('[data-ask-edit]')) return;
  const a = asks.find((x) => x.id === e.target.closest('.ask').dataset.id);
  a.edited = e.target.value.trim();
  try {
    await rpc('quiz_admin_ask_update', { p_pin: pin, p_id: a.id, p_edited: a.edited });
    toast('문구를 저장했어요.');
  } catch (err) {
    toast(err.message);
  }
});

setDlg.addEventListener('click', async (e) => {
  const actEl = e.target.closest('[data-act]');
  const act = actEl?.dataset.act;
  const del = e.target.closest('[data-del]');
  const card = e.target.closest('.qe');
  const i = card ? Number(card.dataset.i) : -1;
  const askId = e.target.closest('.ask')?.dataset.id;
  try {
    if (act === 'ask-filter') {
      askFilter = actEl.dataset.f;
      renderTab();
    } else if (act === 'ask-link') {
      await copyText(askUrl);
      toast('링크를 복사했어요.');
    } else if (act === 'ask-toggle') {
      if (askOpen && !confirm('질문 접수를 마감할까요?\n링크를 열면 마감 안내가 보이고, 다시 열 수도 있어요.')) return;
      await rpc('quiz_admin_ask_open', { p_pin: pin, p_open: !askOpen });
      await loadAsks();
      renderTab();
    } else if (act === 'ask-reload') {
      await loadAsks();
      renderTab();
      toast(`질문 ${asks.length}개를 불러왔어요.`);
    } else if (act === 'ask-copy') {
      const picks = asksOf('pick');
      await copyText(`본사2지부 조합원 사전 질문 ${picks.length}개\n\n${picks.map((a, n) => `${n + 1}. ${a.edited || a.body}`).join('\n\n')}`);
      toast(`질문 ${picks.length}개를 복사했어요.`);
    } else if (act === 'ask-pick' || act === 'ask-hold') {
      await rpc('quiz_admin_ask_update', { p_pin: pin, p_id: askId, p_status: act.slice(4) });
      await loadAsks();
      renderTab();
    } else if (act === 'ask-up' || act === 'ask-down') {
      const ids = asksOf('pick').map((a) => a.id);
      const from = ids.indexOf(askId);
      const to = from + (act === 'ask-up' ? -1 : 1);
      [ids[from], ids[to]] = [ids[to], ids[from]];
      await rpc('quiz_admin_ask_order', { p_pin: pin, p_ids: ids });
      await loadAsks();
      renderTab();
    } else if (act === 'ask-del') {
      if (!confirm('이 질문을 지울까요?\n되돌릴 수 없어요.')) return;
      await rpc('quiz_admin_ask_delete', { p_pin: pin, p_id: askId });
      await loadAsks();
      renderTab();
    } else if (del) {
      if (!confirm(`'${del.dataset.name}' 참여자를 지울까요?`)) return;
      await rpc('quiz_admin_delete_participant', { p_pin: pin, p_id: del.dataset.del });
      await refresh();
      renderTab();
    } else if (act === 'add') {
      draft.push({ question: '', options: ['', '', '', ''], answer: 0, explanation: '' });
      renderTab();
      setBody.scrollTop = setBody.scrollHeight;
    } else if (act === 'del') {
      if (draft.length <= 1) return toast('문제는 1개 이상 있어야 해요.');
      draft.splice(i, 1);
      renderTab();
    } else if (act === 'ox') {
      draft[i].options = ['O', 'X', '', ''];
      if (draft[i].answer > 1) draft[i].answer = 0;
      renderTab();
    } else if (act === 'four') {
      draft[i].options = draft[i].options.map((o) => (o === 'O' || o === 'X' ? '' : o));
      renderTab();
    } else if (act === 'save') {
      const payload = [];
      for (const [n, q] of draft.entries()) {
        const filled = q.options.map((o, j) => ({ o: o.trim(), j })).filter((x) => x.o);
        const ans = filled.findIndex((x) => x.j === q.answer);
        if (!q.question.trim()) throw new Error(`Q${n + 1}: 문제를 입력해 주세요.`);
        if (filled.length < 2) throw new Error(`Q${n + 1}: 보기를 2개 이상 입력해 주세요.`);
        if (ans < 0) throw new Error(`Q${n + 1}: 정답으로 고른 보기가 비어 있어요.`);
        payload.push({ question: q.question.trim(), options: filled.map((x) => x.o), answer: ans, explanation: q.explanation.trim() });
      }
      await rpc('quiz_admin_save_questions', { p_pin: pin, p_questions: payload });
      await loadQuestions();
      await refresh();
      toast(`문제 ${payload.length}개를 저장했어요.`);
    } else if (act === 'info') {
      await rpc('quiz_admin_set_info', { p_pin: pin, p_title: document.getElementById('evTitle').value, p_subtitle: document.getElementById('evSub').value });
      await refresh();
      toast('행사 정보를 저장했어요.');
    } else if (act === 'demo') {
      const n = await rpc('quiz_admin_seed_demo', { p_pin: pin, p_count: 30 });
      await refresh();
      renderTab();
      toast(n ? `테스트 참여자 ${n}명을 추가했어요.` : '이미 테스트 참여자가 있어요.');
    } else if (act === 'reset-winners') {
      if (!confirm('당첨 기록을 모두 지울까요?')) return;
      await rpc('quiz_admin_reset', { p_pin: pin, p_scope: 'winners' });
      await refresh();
      toast('당첨 기록을 지웠어요.');
    } else if (act === 'reset-all') {
      if (!confirm('참여자, 답변, 당첨 기록을 모두 지우고 표지로 돌아갈까요?\n되돌릴 수 없어요.')) return;
      await rpc('quiz_admin_reset', { p_pin: pin, p_scope: 'all' });
      seenIds = new Set();
      await refresh();
      renderTab();
      toast('전체 초기화했어요.');
    } else if (act === 'pin') {
      const v = document.getElementById('newPin').value.trim();
      await rpc('quiz_admin_set_pin', { p_pin: pin, p_new_pin: v });
      pin = v;
      store.set(PIN_KEY, v);
      toast('PIN을 바꿨어요.');
      renderTab();
    } else if (act === 'logout') {
      store.set(PIN_KEY, null);
      location.reload();
    }
  } catch (err) {
    toast(err.message);
  }
});

if (pin) start();
else showLogin();
</script>
</body>
</html>
