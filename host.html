<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>진행 화면 · 본사2지부 문화행사</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/base.css">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
  body.host { background: #050f33; overflow: hidden; height: 100vh; }
  #stage {
    position: fixed;
    left: 50%;
    top: 50%;
    width: 1920px;
    height: 1080px;
    transform: translate(-50%, -50%) scale(var(--s, 0.5));
    background: var(--page);
    overflow: hidden;
    user-select: none;
  }

  .slide { position: absolute; inset: 0; display: flex; flex-direction: column; animation: enter 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  @keyframes enter { from { opacity: 0; transform: translateY(28px); } }
  .title { font-size: 64px; font-weight: 800; letter-spacing: -0.02em; margin: 0; color: var(--b-navy); }
  .eyebrow { display: inline-flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 700; color: var(--b-blue); letter-spacing: 0.02em; }
  .eyebrow .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--b-blue); box-shadow: 0 0 0 8px rgba(29, 87, 230, 0.15); animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 16px rgba(29, 87, 230, 0); } }

  .chips { display: flex; flex-wrap: wrap; gap: 12px; }
  .chip {
    display: inline-flex; align-items: center; height: 56px; padding: 0 24px; border-radius: 999px;
    background: #fff; border: 2px solid var(--b-sky-2); color: var(--b-navy); font-size: 28px; font-weight: 700; white-space: nowrap;
  }
  .chip.new { animation: pop 0.6s cubic-bezier(0.3, 1.6, 0.5, 1) both; border-color: var(--b-blue); }
  @keyframes pop { from { transform: scale(0.3); opacity: 0; } }
  .chip.more { background: var(--b-sky); border-color: transparent; color: var(--b-blue-700); }
  .chip[hidden] { display: none; }

  .qr svg { display: block; width: 100%; height: 100%; }

  /* ── 표지 ── */
  .cover { display: grid; grid-template-columns: 1fr 900px; }
  .cover-left { padding: 96px 80px 90px 120px; display: flex; flex-direction: column; min-width: 0; }
  .cover-org { font-size: 40px; font-weight: 800; color: var(--b-blue); letter-spacing: -0.01em; }
  .cover-main { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; }
  .cover-title { font-size: 176px; line-height: 1.12; font-weight: 900; letter-spacing: -0.04em; color: var(--b-navy); margin: 0; }
  .cover-sub { font-size: 60px; font-weight: 800; color: var(--b-blue); margin: 36px 0 0; letter-spacing: -0.02em; }
  .joined-count { font-size: 44px; font-weight: 700; color: var(--ink-2); }
  .joined-count strong { font-size: 84px; font-weight: 900; color: var(--b-blue); margin-right: 8px; font-variant-numeric: tabular-nums; }
  .cover-right {
    position: relative; overflow: hidden;
    background: radial-gradient(circle at 80% 0%, #3d77ff 0%, transparent 55%), linear-gradient(160deg, var(--b-blue) 0%, var(--b-navy) 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff;
  }
  .cover-right::before, .cover-right::after { content: ''; position: absolute; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.12); }
  .cover-right::before { width: 900px; height: 900px; left: -200px; bottom: -520px; }
  .cover-right::after { width: 560px; height: 560px; right: -240px; top: -200px; }
  .qr-card { position: relative; z-index: 1; background: #fff; border-radius: 44px; padding: 40px; box-shadow: 0 40px 80px rgba(3, 12, 45, 0.35); }
  .qr-card .qr { width: 680px; height: 680px; }
  .qr-caption { position: relative; z-index: 1; margin-top: 40px; text-align: center; }
  .qr-caption b { display: block; font-size: 52px; font-weight: 800; }
  .qr-caption span { display: block; margin-top: 12px; font-size: 30px; opacity: 0.8; font-weight: 600; letter-spacing: 0.01em; }

  /* ── 조합원 질문 ── */
  .qna {
    padding: 60px 96px 64px; color: #fff;
    background: radial-gradient(circle at 85% 0%, #3d77ff 0%, transparent 55%), linear-gradient(160deg, var(--b-blue) 0%, var(--b-navy) 100%);
  }
  .qna-badge { background: #fff; color: var(--b-blue); border-radius: 26px; padding: 22px 34px; font-weight: 900; font-size: 44px; white-space: nowrap; }
  .qna-of { font-size: 44px; font-weight: 800; opacity: 0.85; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .qna .q-progress i { background: rgba(255, 255, 255, 0.22); }
  .qna .q-progress i.done { background: #fff; }
  .qna .q-progress i.now { background: #fff; opacity: 0.6; }
  .qna-body { flex: 1; min-height: 0; display: flex; align-items: center; margin: 36px 0; }
  .qna-text { margin: 0; width: 100%; font-weight: 800; line-height: 1.38; letter-spacing: -0.025em; white-space: pre-wrap; overflow-wrap: anywhere; }
  .qna-foot { font-size: 40px; font-weight: 800; color: var(--gold); }

  /* ── 문제 ── */
  .question { padding: 60px 96px 56px; }
  .q-head { display: flex; align-items: center; gap: 28px; height: 184px; }
  .q-badge { background: var(--b-blue); color: #fff; border-radius: 26px; padding: 12px 30px; font-weight: 900; font-size: 64px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .q-of { font-size: 40px; font-weight: 800; color: var(--muted); }
  .q-progress { flex: 1; display: flex; gap: 10px; margin: 0 24px; }
  .q-progress i { flex: 1; height: 12px; border-radius: 6px; background: var(--b-sky-2); }
  .q-progress i.done { background: var(--b-blue); }
  .q-progress i.now { background: var(--b-blue); opacity: 0.45; }
  .mini-qr { flex: none; background: #fff; border-radius: 22px; padding: 10px; box-shadow: var(--shadow); }
  .mini-qr .qr { width: 164px; height: 164px; }
  .q-timer { position: relative; flex: none; width: 164px; height: 164px; display: grid; place-items: center; }
  .q-timer[hidden], .revealed .q-timer { display: none; }
  .q-timer svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  .q-timer .track { fill: #fff; stroke: var(--b-sky-2); stroke-width: 9; }
  .q-timer .arc { fill: none; stroke: var(--b-blue); stroke-width: 9; stroke-linecap: round; stroke-dasharray: 100 100; }
  .q-timer b { position: relative; font-size: 80px; font-weight: 900; line-height: 1; letter-spacing: -0.03em; color: var(--b-navy); font-variant-numeric: tabular-nums; }
  .q-timer.urgent .arc { stroke: var(--danger); }
  .q-timer.urgent b { color: var(--danger); animation: timer-beat 1s ease-out infinite; }
  @keyframes timer-beat { from { transform: scale(1.18); } 45%, to { transform: scale(1); } }
  .q-timer.over .track { stroke: var(--danger); }
  .q-timer.over b { font-size: 48px; color: var(--danger); letter-spacing: -0.02em; animation: none; }
  .q-text { margin: 40px 0 40px; font-weight: 800; line-height: 1.3; letter-spacing: -0.025em; color: var(--b-navy); font-size: 72px; }
  .q-text.md { font-size: 60px; }
  .q-text.sm { font-size: 50px; }

  .options { flex: 1; min-height: 0; display: grid; gap: 28px; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; }
  .options.n3 { grid-template-columns: 1fr; }
  .opt {
    position: relative; display: flex; align-items: center; gap: 30px; padding: 0 44px; min-height: 0;
    background: #fff; border: 3px solid var(--line); border-radius: 32px; overflow: hidden; box-shadow: var(--shadow);
    transition: opacity 0.5s, transform 0.5s cubic-bezier(0.3, 1.4, 0.5, 1), background 0.4s, border-color 0.4s, box-shadow 0.4s, color 0.4s;
  }
  .opt > * { position: relative; z-index: 1; }
  .opt .num { flex: none; width: 80px; height: 80px; border-radius: 50%; background: var(--b-sky); color: var(--b-blue); font-size: 42px; font-weight: 900; display: grid; place-items: center; transition: background 0.4s; }
  .opt .label { flex: 1; font-size: 48px; font-weight: 750; line-height: 1.25; }
  .options.short .opt { justify-content: center; }
  .options.short .opt .label { flex: none; font-size: 150px; font-weight: 900; }
  .options.short .opt .num { position: absolute; left: 36px; top: 36px; }
  .options.short .opt .stat { position: absolute; right: 40px; bottom: 32px; }
  .opt .stat { font-size: 34px; font-weight: 800; color: var(--ink-2); white-space: nowrap; opacity: 0; transition: opacity 0.4s 0.3s; font-variant-numeric: tabular-nums; }
  .opt .fill { position: absolute; inset: 0 auto 0 0; z-index: 0; width: 0; background: var(--b-sky); transition: width 1s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s; }
  .opt .check { display: none; flex: none; width: 64px; height: 64px; }
  .revealed .opt .stat { opacity: 1; }
  .revealed .opt .fill { width: var(--pct, 0%); }
  .revealed .opt:not(.correct) { opacity: 0.5; box-shadow: none; }
  .revealed .opt.correct { background: var(--b-blue); border-color: var(--b-blue); color: #fff; transform: scale(1.025); box-shadow: 0 24px 60px rgba(29, 87, 230, 0.38); }
  .revealed .opt.correct .num { background: #fff; }
  .revealed .opt.correct .fill { background: rgba(255, 255, 255, 0.16); }
  .revealed .opt.correct .stat { color: #fff; }
  .revealed .opt.correct .check { display: block; }
  .options.short .opt .check { position: absolute; right: 40px; top: 36px; }

  .explain { display: none; margin-top: 26px; padding: 22px 32px; border-radius: 22px; background: #fff; border-left: 10px solid var(--b-blue); font-size: 34px; font-weight: 600; color: var(--ink-2); line-height: 1.45; }
  .revealed .explain.has { display: block; animation: enter 0.5s 0.4s both; }

  .q-foot { display: flex; align-items: center; gap: 36px; margin-top: 30px; height: 64px; }
  .live { display: inline-flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 800; color: var(--b-blue); background: var(--b-sky); border-radius: 999px; padding: 12px 26px; }
  .live i { width: 14px; height: 14px; border-radius: 50%; background: var(--b-blue); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0.2; } }
  .revealed .live { background: var(--b-navy); color: #fff; }
  .revealed .live i { display: none; }
  .answered { display: flex; align-items: center; gap: 22px; font-size: 32px; font-weight: 700; color: var(--ink-2); }
  .answered b { color: var(--ink); font-size: 40px; font-variant-numeric: tabular-nums; }
  .meter { width: 420px; height: 14px; border-radius: 7px; background: var(--b-sky-2); overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; background: var(--b-blue); border-radius: 7px; transition: width 0.6s; }
  .voters { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; max-height: 106px; overflow: hidden; }
  .voters:empty { display: none; }
  .voters .chip { height: 48px; padding: 0 20px; font-size: 24px; }
  .voters .chip.ok { background: var(--b-blue); border-color: var(--b-blue); color: #fff; }
  .voters .chip.no { opacity: 0.4; }
  .key-hint { margin-left: auto; font-size: 26px; font-weight: 600; color: var(--muted); }
  .key-hint kbd { font: inherit; font-weight: 800; color: var(--ink-2); background: #fff; border: 2px solid var(--line); border-radius: 10px; padding: 2px 12px; margin-right: 8px; }

  /* ── 결과 ── */
  .result { padding: 72px 110px 56px; }
  /* 하루 입장 70명 기준: 그래프를 화면 너비 가득 쓰고, 숫자 요약은 제목 줄에 둔다 */
  .result-head { display: flex; align-items: center; justify-content: space-between; gap: 40px; }
  .kpis { display: flex; gap: 16px; }
  .kpi { display: flex; align-items: baseline; gap: 14px; background: #fff; border-radius: 999px; padding: 16px 34px; box-shadow: var(--shadow); }
  .kpi span { font-size: 26px; font-weight: 700; color: var(--ink-2); }
  .kpi b { font-size: 52px; font-weight: 900; color: var(--ink); letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  .kpi b small { font-size: 28px; font-weight: 700; margin-left: 4px; color: var(--ink-2); }
  .kpi.accent { background: var(--b-blue); }
  .kpi.accent span, .kpi.accent b, .kpi.accent b small { color: #fff; }
  .chart-card { flex: 1; min-height: 0; margin-top: 36px; background: #fff; border-radius: 32px; padding: 32px 44px 24px; box-shadow: var(--shadow); display: flex; flex-direction: column; }
  .chart-card h3 { margin: 0; font-size: 30px; font-weight: 800; color: var(--ink); }
  /* 정답 개수별 인원: 막대 대신 이름을 아래에서부터 쌓는다 */
  .stack-chart { flex: 1; min-height: 0; display: flex; flex-direction: column; margin-top: 8px; }
  .stack-cols, .stack-x { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); column-gap: 8px; }
  .stack-cols { flex: 1; min-height: 0; overflow: hidden; border-bottom: 3px solid #e3e9f5; }
  .stack-col { display: flex; flex-direction: column; justify-content: flex-end; min-width: 0; }
  .stack-col > b { text-align: center; font-size: 30px; font-weight: 800; color: var(--ink); line-height: 1; margin-bottom: 10px; font-variant-numeric: tabular-nums; }
  .stack-col > b small { font-size: 20px; font-weight: 700; margin-left: 2px; color: var(--ink-2); }
  .stack { display: flex; flex-wrap: wrap-reverse; gap: var(--g); }
  .stack > span {
    flex: 0 0 calc((100% - (var(--k) - 1) * var(--g)) / var(--k)); height: var(--rh); line-height: var(--rh);
    font-size: var(--fs); font-weight: 700; color: #fff; background: var(--b-blue); border-radius: 6px;
    text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 3px;
    animation: stack-in 0.45s cubic-bezier(0.3, 1.4, 0.5, 1) both; animation-delay: var(--d);
  }
  .stack-col.top .stack > span { background: var(--gold); color: #0b1f5b; }
  .stack > span.more { background: #d7e2fb; color: var(--ink); }
  .stack-x { margin-top: 12px; }
  .stack-x span { text-align: center; font-size: 24px; font-weight: 700; color: #44516f; }
  .stack-x span:last-child { color: var(--ink); font-weight: 800; }
  @keyframes stack-in { from { opacity: 0; transform: translateY(-40px); } }
  .perfect { display: flex; align-items: center; gap: 28px; margin-top: 28px; min-height: 64px; }
  .perfect > span { flex: none; font-size: 30px; font-weight: 800; color: var(--b-blue); }
  .perfect .chips { max-height: 56px; overflow: hidden; }

  /* ── 추첨 ── */
  .draw { padding: 64px 96px; }
  .arena { position: absolute; inset: 0; z-index: 0; overflow: hidden; }
  .arena .chip { position: absolute; left: 0; top: 0; opacity: 0.32; will-change: transform; }
  .arena.idle .chip { animation: drift 6s ease-in-out infinite alternate; }
  @keyframes drift { to { translate: 18px -22px; } }
  .draw-head { position: relative; z-index: 2; display: flex; align-items: center; gap: 40px; }
  .pool-picker { margin-left: auto; display: flex; gap: 16px; }
  .pill { display: inline-flex; align-items: center; gap: 14px; height: 76px; padding: 0 30px; border-radius: 999px; border: 3px solid var(--b-sky-2); background: #fff; font-size: 30px; font-weight: 800; color: var(--ink-2); }
  .pill.on { border-color: var(--b-blue); color: var(--b-blue-700); background: var(--b-sky); }
  .pill em { font-style: normal; font-weight: 700; color: var(--muted); }
  .pill.on em { color: var(--b-blue); }
  .pill .step { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--b-sky-2); color: var(--b-blue-700); font-size: 34px; font-weight: 900; line-height: 1; display: grid; place-items: center; }
  .pill .step:hover { background: var(--b-sky-3); }
  .pill .step:disabled { opacity: 0.35; cursor: default; background: var(--b-sky-2); }
  .pill b { min-width: 40px; text-align: center; font-size: 36px; color: var(--ink); }

  .draw-body { position: relative; z-index: 2; flex: 1; display: grid; grid-template-columns: 1fr; margin-top: 40px; min-height: 0; pointer-events: none; }
  .draw-body > * { pointer-events: auto; }
  .slot-wrap { display: grid; place-items: center; }
  .slot {
    width: 1100px; background: #fff; border-radius: 48px; padding: 52px 60px 46px; text-align: center;
    box-shadow: 0 30px 80px rgba(11, 31, 91, 0.18); border: 4px solid var(--b-sky-2); transition: border-color 0.3s, box-shadow 0.3s, transform 0.3s;
  }
  .slot-label { font-size: 32px; font-weight: 700; color: var(--ink-2); }
  .slot-label b { color: var(--b-blue); font-size: 40px; font-variant-numeric: tabular-nums; }
  .slot-name { height: 220px; display: grid; place-items: center; font-size: 150px; font-weight: 900; color: var(--b-navy); letter-spacing: -0.03em; white-space: nowrap; overflow: hidden; }
  .slot-name.ready { color: var(--b-sky-3); font-size: 120px; }
  .slot-hint { font-size: 30px; font-weight: 600; color: var(--muted); }
  .slot-hint kbd { font: inherit; font-weight: 800; color: var(--ink-2); background: var(--b-sky); border-radius: 10px; padding: 4px 14px; margin: 0 4px; }
  .slot-wrap { min-height: 0; }
  .slot-wrap.show-roster .slot, .slot-wrap:not(.show-roster) .roster-box { display: none; }
  .roster-box { display: flex; flex-direction: column; align-items: center; gap: 40px; width: 100%; }
  .roster { display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 18px; max-width: 1640px; max-height: 620px; overflow: hidden; }
  .roster .chip { height: auto; padding: 0.3em 0.85em; font-size: var(--fs, 40px); border-width: 3px; border-color: var(--b-blue); box-shadow: var(--shadow); animation: pop 0.5s cubic-bezier(0.3, 1.6, 0.5, 1) both; }
  .roster .chip.more { border-color: transparent; box-shadow: none; background: var(--b-sky); color: var(--b-blue-700); }
  .slot-actions { display: flex; justify-content: center; gap: 14px; }
  .slot-actions[hidden] { display: none; }
  .slot .again { margin-top: 20px; border: 0; background: var(--b-sky); color: var(--b-blue-700); font-size: 26px; font-weight: 800; padding: 12px 30px; border-radius: 999px; }
  .slot .again:hover { background: var(--b-sky-2); }

  .wheel { position: absolute; inset: 0; z-index: 5; width: 1920px; height: 1080px; pointer-events: none; }
  .wheel[hidden] { display: none; }
  .draw.wheel-on .draw-body, .draw.wheel-on .arena { visibility: hidden; }
  .win-overlay {
    position: absolute; inset: 0; z-index: 10; display: grid; place-items: center; text-align: center; color: #fff;
    background: radial-gradient(circle at 50% 40%, #3d77ff, var(--b-navy) 72%);
    animation: fadein 0.4s both;
  }
  .win-overlay[hidden] { display: none; }
  @keyframes fadein { from { opacity: 0; } }
  .win-overlay canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; pointer-events: none; }
  .win-card { position: relative; animation: zoom 0.7s cubic-bezier(0.3, 1.5, 0.5, 1) both 0.1s; }
  @keyframes zoom { from { transform: scale(0.4); opacity: 0; } }
  .win-rank { display: inline-block; font-size: 36px; font-weight: 800; background: rgba(255, 255, 255, 0.16); border-radius: 999px; padding: 12px 34px; }
  .win-label { font-size: 64px; font-weight: 800; margin-top: 34px; color: var(--gold); }
  .win-name { font-size: 220px; font-weight: 900; letter-spacing: -0.04em; line-height: 1.15; margin-top: 12px; white-space: nowrap; text-shadow: 0 10px 40px rgba(0, 0, 0, 0.25); }
  .win-name::after { content: ''; display: block; height: 14px; width: 60%; margin: 18px auto 0; border-radius: 7px; background: var(--gold); }
  .win-hint { margin-top: 56px; font-size: 28px; font-weight: 600; opacity: 0.7; }

  /* ── 마무리 ── */
  .end { background: radial-gradient(circle at 85% 10%, #3d77ff 0%, transparent 50%), linear-gradient(150deg, var(--b-blue), var(--b-navy)); color: #fff; justify-content: center; padding: 0 140px; }
  .end .eyebrow { color: rgba(255, 255, 255, 0.85); }
  .end h1 { font-size: 150px; font-weight: 900; line-height: 1.12; letter-spacing: -0.04em; margin: 34px 0 0; }
  .end-winners { margin-top: 80px; }
  .end-winners > span { display: block; font-size: 32px; font-weight: 800; color: var(--gold); margin-bottom: 22px; }
  .end-winners .chip { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.28); color: #fff; }

  /* ── 진행 도구 막대 ── */
  #dock {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 50;
    display: flex; align-items: center; gap: 6px; padding: 8px; border-radius: 16px;
    background: rgba(8, 20, 60, 0.92); color: #fff; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    opacity: 0; transition: opacity 0.3s; font-size: 14px;
  }
  body.dock-on #dock, #dock:hover { opacity: 1; }
  #dock button { border: 0; background: transparent; color: #fff; height: 40px; min-width: 40px; padding: 0 12px; border-radius: 10px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  #dock button:hover { background: rgba(255, 255, 255, 0.12); }

<script type="module">
import { rpc, escapeHtml as h } from './assets/api.js';

const PIN_KEY = 'hq2quiz.pin';
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};

const stageEl = document.getElementById('stage');
const joinUrl = new URL('./', location.href).href;
const joinUrlText = joinUrl.replace(/^https?:\/\//, '').replace(/\/$/, '');
const askUrl = new URL('./ask.html', location.href).href;

let pin = store.get(PIN_KEY) || '';
let status = null;
let questions = [];
let steps = [];
let stepIdx = 0;
let renderedKey = null;
let navBusy = false;
let navSeq = 0;
let drawing = false;
let overlayOpen = false;
let voterSeen = new Set();
let arenaSig = '';
// 마지막 추첨의 정답 기준 (정답 N개 이상)은 서버가 정한다: 문제별 추첨 당첨자를 뺀 사람 중 가장 높은 정답 수.
// 만점자가 있으면 만점자 추첨, 없으면 그다음으로 가장 많이 맞힌 사람들 중에서 뽑는다.
// 진행자는 오른쪽 위 −/+ 로 바꿀 수 있다. 서버에 기준이 없으면(DB 변경 전) 이 화면에서 같은 방식으로 계산한다.
let finalMin = null;
let minBusy = false;
function autoMin() {
  if (!status) return total();
  const qwon = new Set(status.winners.filter((w) => w.qno != null).map((w) => w.nickname));
  const left = status.participants.filter((p) => !qwon.has(p.nickname));
  return left.length ? Math.max(...left.map((p) => p.score)) : total();
}
const minScore = () => Math.max(1, Math.min(total() || 1, status?.state.draw_min ?? finalMin ?? autoMin()));
const topScore = () => (status?.participants.length ? Math.max(...status.participants.map((p) => p.score)) : 0);
// 만점 기준이면 '만점자', 참여자 중 최고 정답 수와 같으면 '최다 정답자', 그보다 낮추면 '정답 N개 이상'
const finalWho = () => (minScore() >= total() ? '만점자' : minScore() === topScore() ? '최다 정답자' : '대상자');
const finalTitle = () => (finalWho() === '대상자' ? `정답 ${minScore()}개 이상 추첨` : `${finalWho()} 추첨`);

// ───────── 공통 ─────────
function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  stageEl.style.setProperty('--s', s);
}
addEventListener('resize', fit);
fit();

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  // 설정 창 위에도 보이도록 매번 맨 위 층으로 다시 띄운다
  try { el.hidePopover(); el.showPopover(); } catch {}
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

function qrSvg(text, fg = '#0b1f5b') {
  if (!window.qrcode) return '';
  const qr = qrcode(0, 'M');
  qr.addData(text);
  qr.make();
  const n = qr.getModuleCount();
  const m = 2;
  let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${c + m},${r + m}h1v1h-1z`;
  const s = n + m * 2;
  return `<svg viewBox="0 0 ${s} ${s}" shape-rendering="crispEdges" aria-label="참여 QR 코드"><rect width="${s}" height="${s}" fill="#fff"/><path d="${d}" fill="${fg}"/></svg>`;
}

const CHECK = '<svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10.5" stroke-width="2"/><path d="M7 12.5l3.2 3.2L17 9"/></svg>';
const pad2 = (n) => String(n).padStart(2, '0');
const rand = (a, b) => a + Math.random() * (b - a);
const total = () => questions.length;

// ───────── 효과음 ─────────
// 소리 파일 없이 브라우저가 바로 만들어 낸다 (저작권 걱정 없음). 진행 도구의 소리 버튼이나 M 키로 끄고 켠다.
// 브라우저는 화면을 한 번도 누르지 않은 페이지의 소리를 막으므로, 첫 키·클릭 때 오디오를 깨워 둔다.
const SOUND_KEY = 'hq2quiz.sound';
let soundOn = store.get(SOUND_KEY) !== 'off';
let actx = null;
let master = null;
let noiseBuf = null;
function audio() {
  if (!soundOn) return null;
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    actx = new AC();
    master = actx.createGain();
    master.gain.value = 0.9;
    // 소리가 여러 개 겹쳐도 찢어지지 않게 눌러 준다
    const comp = actx.createDynamicsCompressor();
    master.connect(comp).connect(actx.destination);
    noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (actx.state === 'suspended') actx.resume().catch(() => {});
  return actx;
}
addEventListener('pointerdown', () => audio());
addEventListener('keydown', () => audio());

function tone(freq, at, dur, { type = 'sine', vol = 0.2, attack = 0.005, to = null } = {}) {
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, at);
  if (to) o.frequency.exponentialRampToValueAtTime(to, at + dur);
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(vol, at + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g).connect(master);
  o.start(at);
  o.stop(at + dur + 0.05);
}
function noise(at, dur, { vol = 0.2, type = 'bandpass', freq = 2000, q = 1, attack = 0.002 } = {}) {
  const s = actx.createBufferSource();
  const f = actx.createBiquadFilter();
  const g = actx.createGain();
  s.buffer = noiseBuf;
  s.loop = true;
  f.type = type;
  f.frequency.value = freq;
  f.Q.value = q;
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(vol, at + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  s.connect(f).connect(g).connect(master);
  s.start(at, Math.random() * 0.5);
  s.stop(at + dur + 0.05);
}
// 나팔 비슷한 소리: 톱니파 두 개를 살짝 어긋나게 겹치고, 불기 시작할 때 소리가 밝아진다
function brass(freq, at, dur, vol = 0.12) {
  const f = actx.createBiquadFilter();
  const g = actx.createGain();
  f.type = 'lowpass';
  f.Q.value = 1;
  f.frequency.setValueAtTime(freq * 1.5, at);
  f.frequency.linearRampToValueAtTime(freq * 6, at + 0.06);
  f.frequency.exponentialRampToValueAtTime(freq * 2.5, at + dur + 0.15);
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(vol, at + 0.03);
  g.gain.setValueAtTime(vol * 0.8, at + Math.max(0.04, dur - 0.06));
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur + 0.15);
  f.connect(g).connect(master);
  [0, 9].forEach((detune) => {
    const o = actx.createOscillator();
    o.type = 'sawtooth';
    o.frequency.value = freq;
    o.detune.value = detune;
    o.connect(f);
    o.start(at);
    o.stop(at + dur + 0.2);
  });
}

let pegAt = 0;
const sfx = {
  // 룰렛이 도는 동안 작은북을 굴린다 (두구두구, 점점 크게). 멈추는 순간에 맞춰 끝난다
  drumroll(ms) {
    const a = audio();
    if (!a) return;
    const t0 = a.currentTime + 0.02;
    const rate = 20;
    const n = Math.floor((ms / 1000) * rate);
    for (let i = 0; i < n; i++) {
      const p = i / n;
      noise(t0 + i / rate + rand(0, 0.008), 0.07, { vol: 0.04 + 0.16 * p * p, freq: 1600, q: 0.8 });
    }
  },
  // 바늘이 못을 넘을 때 '딱'. 빠르게 돌 때는 작게, 느려지면 또렷하게
  peg(slow) {
    const a = audio();
    if (!a) return;
    const t = a.currentTime;
    if (t - pegAt < 0.035) return;
    pegAt = t;
    noise(t, 0.03, { vol: slow ? 0.45 : 0.18, freq: 3400, q: 3 });
    tone(slow ? 1500 : 1200, t, 0.035, { type: 'triangle', vol: slow ? 0.14 : 0.06 });
  },
  // 룰렛이 멈추면 '딩!'
  stop() {
    const a = audio();
    if (!a) return;
    const t = a.currentTime;
    [[1318.5, 0.22], [1975.5, 0.1], [2637, 0.05]].forEach(([fq, v]) => tone(fq, t, 1.4, { vol: v, attack: 0.003 }));
  },
  // 당첨 화면: 빠바밤~ 빰! 나팔과 심벌
  fanfare() {
    const a = audio();
    if (!a) return;
    const t = a.currentTime + 0.03;
    [[392, 0, 0.1], [392, 0.12, 0.1], [392, 0.24, 0.1], [523.25, 0.36, 0.4], [440, 0.82, 0.11], [523.25, 0.96, 0.11]]
      .forEach(([fq, at, d]) => brass(fq, t + at, d));
    [523.25, 659.25, 783.99, 1046.5].forEach((fq) => brass(fq, t + 1.12, 1.3, 0.09));
    noise(t + 1.12, 1.8, { vol: 0.16, type: 'highpass', freq: 5000, q: 0.5, attack: 0.005 });
    tone(130.8, t + 1.12, 0.6, { vol: 0.25, to: 98 });
  },
  // 응답 시간: 1초마다 작게 '똑', 마지막 5초는 '삑'
  tick(sec) {
    const a = audio();
    if (!a) return;
    const t = a.currentTime;
    if (sec <= 5) {
      tone(sec === 1 ? 1175 : 988, t, 0.14, { type: 'square', vol: 0.06 });
    } else {
      noise(t, 0.025, { vol: 0.08, freq: sec % 2 ? 2600 : 2000, q: 4 });
    }
  },
  // 시간 끝 '삐-'
  timeUp() {
    const a = audio();
    if (!a) return;
    const t = a.currentTime;
    tone(220, t, 0.8, { type: 'square', vol: 0.07, attack: 0.01 });
    tone(233, t, 0.8, { type: 'square', vol: 0.05, attack: 0.01 });
  },
  // 정답 공개 '띠리링~'
  reveal() {
    const a = audio();
    if (!a) return;
    const t = a.currentTime + 0.02;
    [1046.5, 1318.5, 1568, 2093].forEach((fq, i) => {
      tone(fq, t + i * 0.09, 0.9, { vol: 0.16, attack: 0.004 });
      tone(fq * 2, t + i * 0.09, 0.4, { vol: 0.04, attack: 0.004 });
    });
  },
  // 소리를 켤 때 스피커 확인용으로 짧게
  hello() {
    const a = audio();
    if (!a) return;
    const t = a.currentTime;
    tone(1046.5, t, 0.25, { vol: 0.15 });
    tone(1568, t + 0.1, 0.35, { vol: 0.15 });
  },
};

// ───────── 단계 ─────────
function buildSteps(n, qnaCount) {
  const list = [{ stage: 'cover' }];
  for (let i = 1; i <= qnaCount; i++) list.push({ stage: 'qna', qno: i });
  for (let i = 1; i <= n; i++) {
    list.push({ stage: 'q', qno: i, revealed: false });
    list.push({ stage: 'q', qno: i, revealed: true });
    list.push({ stage: 'qdraw', qno: i });
  }
  list.push({ stage: 'result' }, { stage: 'draw' }, { stage: 'end' });
  return list;
}
function indexOfState(s) {
  const i = steps.findIndex((st) => st.stage === s.stage && (st.qno || 0) === (s.qno || 0)
    && (st.stage !== 'q' || st.revealed === s.revealed));
  if (i >= 0) return i;
  // 보여 주던 질문이 목록에서 빠지면 남은 질문 중 마지막에 머문다
  return s.stage === 'qna' ? Math.max(0, steps.map((st) => st.stage).lastIndexOf('qna')) : 0;
}
function stepName(st) {
  if (!st) return '-';
  if (st.stage === 'qdraw') return `Q${st.qno} 정답자 추첨`;
  if (st.stage === 'qna') return `조합원 질문 ${st.qno}`;
  if (st.stage === 'draw') return status ? finalTitle() : '마지막 추첨';
  return { cover: '표지 · QR', result: '퀴즈 결과', end: '마무리' }[st.stage]
    || `Q${st.qno} ${st.revealed ? '정답 공개' : '응답 받는 중'}`;
}

// ───────── 데이터 ─────────
async function loadQuestions() {
  questions = await rpc('quiz_admin_questions', { p_pin: pin });
  steps = buildSteps(questions.length, qnaCount);
  renderedKey = null;
}

// 제한시간: 시계가 어긋나도 맞도록 서버의 남은 시간을 받아 이 화면에서 줄여 나간다
let timerEnd = null;
let timerNo = 0;
let timerLimit = 30000;
let timerOff = false;
function syncTimer() {
  const cur = status.current;
  const open = cur && status.state.stage === 'q' && !status.state.revealed;
  timerOff = !!open && cur.remaining_ms == null;
  // 제한시간은 서버 값 하나만 고치면 되도록 화면 문구도 여기서 맞춘다
  if (cur?.limit_ms) {
    timerLimit = cur.limit_ms;
    document.getElementById('timerBtn').textContent = `${timerLimit / 1000}초 다시`;
  }
  if (!open || cur.remaining_ms == null) { timerEnd = null; timerNo = 0; return; }
  const end = performance.now() + cur.remaining_ms;
  if (timerNo !== cur.no || Math.abs(end - timerEnd) > 400) { timerEnd = end; timerNo = cur.no; }
}
// 시간이 실제로 줄어들 때만 소리를 낸다 (서버 시간을 받기 전, 정답 공개 뒤, '30초 다시'로 늘어날 때는 조용히)
let soundNo = 0;
let soundSec = null;
function timerSound(st, secLeft) {
  const live = !timerOff && !st.revealed && timerEnd != null && timerNo === st.qno;
  if (!live || soundNo !== st.qno) {
    soundNo = st.qno;
    soundSec = live ? secLeft : null;
    return;
  }
  if (soundSec != null && secLeft < soundSec) {
    if (secLeft === 0) sfx.timeUp();
    else sfx.tick(secLeft);
  }
  soundSec = secLeft;
}
function paintTimer() {
  requestAnimationFrame(paintTimer);
  const el = stageEl.querySelector('[data-timer]');
  const st = steps[stepIdx];
  if (!el || st?.stage !== 'q') return;
  el.hidden = timerOff;
  // 새 문제로 넘어온 직후 서버 응답이 오기 전에는 꽉 찬 시간을 보여 준다
  const left = timerNo === st.qno ? Math.max(0, timerEnd - performance.now()) : timerLimit;
  const over = left === 0;
  el.querySelector('[data-arc]').style.strokeDashoffset = 100 * (1 - left / timerLimit);
  const label = over ? '마감' : String(Math.ceil(left / 1000));
  const sec = el.querySelector('[data-sec]');
  if (sec.textContent !== label) sec.textContent = label;
  timerSound(st, Math.ceil(left / 1000));
  el.classList.toggle('over', over);
  el.classList.toggle('urgent', !over && left <= 5000);
  const live = stageEl.querySelector('[data-live]');
  const text = st.revealed ? '정답 공개' : over ? '응답 마감' : '응답 받는 중';
  if (live && live.textContent !== text) live.textContent = text;
}
requestAnimationFrame(paintTimer);

let qnaCount = 0;
let pollTimer;
async function refresh() {
  clearTimeout(pollTimer);
  const seq = navSeq;
  try {
    const s = await rpc('quiz_admin_status', { p_pin: pin });
    setConn(true);
    // −/+ 로 바꾼 기준을 저장하는 중이면 바꾼 값을 그대로 둔다 (잠깐 이전 값으로 돌아가 보이지 않게)
    if (minBusy && status) s.state.draw_min = status.state.draw_min;
    if (s.state.total !== questions.length) await loadQuestions();
    if (s.qna.length !== qnaCount) {
      qnaCount = s.qna.length;
      steps = buildSteps(questions.length, qnaCount);
    }
    status = s;
    syncTimer();
    if (!navBusy && seq === navSeq) stepIdx = indexOfState(s.state);
    render();
  } catch (e) {
    if (e.code === 'invalid_pin') { showLogin(); return; }
    setConn(false);
  }
  pollTimer = setTimeout(refresh, 1500);
}
function setConn(ok) {
  const el = document.getElementById('conn');
  el.classList.toggle('off', !ok);
  el.title = ok ? '연결됨' : '연결이 끊겼어요. 다시 연결 중…';
}

async function go(idx) {
  if (navBusy || drawing || idx < 0 || idx >= steps.length) return;
  if (overlayOpen) closeOverlay();
  const prev = stepIdx;
  const st = steps[idx];
  const was = steps[prev];
  // 같은 문제에서 정답 공개로 넘어갈 때 '띠리링~'
  if (st.stage === 'q' && st.revealed && was?.stage === 'q' && was.qno === st.qno && !was.revealed) sfx.reveal();
  stepIdx = idx;
  navBusy = true;
  navSeq++;
  render();
  try {
    await rpc('quiz_admin_set_state', { p_pin: pin, p_stage: st.stage, p_qno: st.qno || 0, p_revealed: !!st.revealed });
  } catch (e) {
    stepIdx = prev;
    render();
    toast(e.message);
  } finally {
    navBusy = false;
    navSeq++;
    refresh();
  }
}
function next() {
  const st = steps[stepIdx];
  if (st?.stage === 'draw' || st?.stage === 'qdraw') {
    if (overlayOpen) { closeOverlay(); return; }
    if (drawing) return;
    // 한 명 뽑았거나 뽑을 사람이 없으면 다음 화면으로 넘어간다 (더 뽑으려면 '한 명 더 추첨')
    const done = winnersOf(st).length > 0 || drawPool(st).length === 0;
    if (!done) { startDraw(); return; }
  }
  go(stepIdx + 1);
}
function prev() {
  if (overlayOpen) { closeOverlay(); return; }
  go(stepIdx - 1);
}

// ───────── 화면 그리기 ─────────
function render() {
  const st = steps[stepIdx];
  if (!st || !status) return;
  document.getElementById('stepLabel').textContent = stepName(st);
  document.getElementById('prevBtn').disabled = stepIdx === 0;
  document.getElementById('nextBtn').disabled = stepIdx === steps.length - 1;
  document.getElementById('timerBtn').hidden = !(st.stage === 'q' && !st.revealed);
  const key = st.stage + (st.qno || '');
  if (key !== renderedKey) {
    renderedKey = key;
    arenaSig = '';
    overlayOpen = false;
    stageEl.innerHTML = VIEWS[st.stage].html(st);
    VIEWS[st.stage].mount?.(st);
  }
  VIEWS[st.stage].update(st);
}

function shrinkToFit(el, sizes, maxHeight) {
  for (const size of sizes) {
    el.style.fontSize = `${size}px`;
    if (el.offsetHeight <= maxHeight && el.scrollWidth <= el.clientWidth) return;
  }
}

        if (drawing || overlayOpen || minBusy) return;
        const k = Math.max(1, Math.min(total(), minScore() + Number(el.dataset.k)));
        if (status.state.draw_min == null) { finalMin = k; render(); return; }
        minBusy = true;
        status.state.draw_min = k;
        render();
        try {
          await rpc('quiz_admin_set_draw_min', { p_pin: pin, p_min: k });
        } catch (err) { toast(err.message); }
        minBusy = false;
        refresh();
      }));
    },
    update(st) {
      if (drawing) return;
      const root = stageEl.querySelector('.draw');
      const qd = st.stage === 'qdraw';
      const pool = drawPool(st);
      const eligible = qualifiers(st);
      if (qd) {
        root.querySelector('[data-correct-n]').textContent = `${eligible.length}명`;
      } else {
        const k = minScore();
        root.querySelector('[data-title]').textContent = finalTitle();
        root.querySelector('[data-k-val]').textContent = k;
        root.querySelector('[data-min-n]').textContent = `${eligible.length}명`;
        root.querySelector('[data-k="-1"]').disabled = k <= 1;
        root.querySelector('[data-k="1"]').disabled = k >= total();
      }
      root.querySelector('[data-pool-n]').textContent = pool.length;

      if (overlayOpen) return;
      // 추첨 상자: 대기 / 이번 추첨 당첨자 / 후보 없음
      const mine = winnersOf(st);
      const who = qd ? '정답자' : finalWho();
      const after = !qd ? '마무리' : st.qno < total() ? '다음 문제' : '퀴즈 결과';
      let name = 'READY';
      let hint = `<kbd>Space</kbd> 또는 <kbd>→</kbd> 를 누르면 ${who} 중 한 명을 추첨합니다`;
      if (mine.length) {
        name = mine[mine.length - 1].nickname;
        hint = `당첨을 축하합니다! · <kbd>→</kbd> ${after}`;
      } else if (!pool.length) {
        name = eligible.length ? '추첨 대상 없음' : `${who} 없음`;
        hint = eligible.length
          ? `${who} ${eligible.length}명이 모두 이미 당첨됐어요`
          : qd ? '이번 문제는 맞힌 사람이 없어요' : who === '만점자' ? '만점자가 없어요' : `정답 ${minScore()}개 이상인 사람이 없어요`;
        if (!qd && minScore() > 1) hint += ' · 오른쪽 위 <kbd>−</kbd> 로 기준을 낮출 수 있어요';
        hint += ` · <kbd>→</kbd> ${after}`;
      }
      const nameEl = root.querySelector('[data-slot-name]');
      if (nameEl.dataset.v !== name) {
        nameEl.dataset.v = name;
        nameEl.textContent = name;
        nameEl.classList.toggle('ready', !mine.length);
        if (mine.length) fitName(nameEl, name, 150, 960);
        else nameEl.style.fontSize = '';
      }
      const hintEl = root.querySelector('[data-slot-hint]');
      if (hintEl.innerHTML !== hint) hintEl.innerHTML = hint;
      const actions = root.querySelector('[data-actions]');
      if (actions) {
        actions.hidden = !mine.length;
        root.querySelector('[data-again]').hidden = !pool.length;
      }

      // 뽑기 전에는 후보 아이디를 화면 가운데에 크게 보여 준다
      const showRoster = !mine.length && pool.length > 0;
      root.querySelector('[data-slot-wrap]').classList.toggle('show-roster', showRoster);
      if (showRoster) {
        const skipped = eligible.length - pool.length;
        renderRoster(root.querySelector('[data-roster]'), pool);
        const rh = `<kbd>Space</kbd> 또는 <kbd>→</kbd> 를 누르면 ${who} 중 한 명을 추첨합니다${skipped > 0 ? ` · 이미 당첨된 ${skipped}명 제외` : ''}`;
        const rhEl = root.querySelector('[data-roster-hint]');
        if (rhEl.innerHTML !== rh) rhEl.innerHTML = rh;
      }

      const sig = `${showRoster ? 'r' : 'a'}|${pool.map((p) => p.id).join()}`;
      if (sig !== arenaSig) {
        arenaSig = sig;
        idleArena(showRoster ? [] : pool.map((p) => p.nickname));
      }
    },
  },

  end: {
    html: () => `
      <section class="slide end">
        <div class="eyebrow" data-title></div>
        <h1>함께해 주셔서<br>감사합니다</h1>
        <div class="end-winners" data-end-winners></div>
      </section>`,
    update() {
      const root = stageEl.querySelector('.end');
      root.querySelector('[data-title]').textContent = status.state.title;
      const ws = status.winners;
      root.querySelector('[data-end-winners]').innerHTML = ws.length
        ? `<span>오늘의 당첨자</span><div class="chips">${ws.map((w) => `<span class="chip">${h(w.nickname)}</span>`).join('')}</div>`
        : '';
    },
  },
};

VIEWS.qdraw = VIEWS.draw;

function currentOf(st) {
  return status.current && status.current.no === st.qno ? status.current : null;
}
// 이 추첨 화면에서 뽑힌 사람: 문제 정답자 추첨이면 그 문제 번호, 마지막 추첨이면 문제 번호 없음
function winnersOf(st) {
  const qno = st.stage === 'qdraw' ? st.qno : null;
  return status.winners.filter((w) => (w.qno ?? null) === qno);
}
// 후보 조건을 채운 사람 (당첨 여부와 상관없이): 그 문제를 맞힌 사람 / 정답 기준 이상인 사람
function qualifiers(st) {
  if (st.stage === 'qdraw') {
    const cur = currentOf(st);
    return cur ? cur.answers.filter((a) => a.choice === cur.answer) : [];
  }
  return status.participants.filter((p) => p.score >= minScore());
}
// 추첨 후보: 조건을 채운 사람 중 아직 당첨되지 않은 사람 (문제별 당첨자도 빠진다)
function drawPool(st) {
  const won = new Set(status.participants.filter((p) => p.won).map((p) => p.id));
  return qualifiers(st).filter((p) => !won.has(p.id));
}

// 응답한 사람 아이디: 응답 중에는 최근 순, 정답 공개 뒤에는 맞힌 사람(파랑) 먼저
function renderVoters(el, answers, answer) {
  const list = answer == null
    ? [...answers].reverse()
    : [...answers.filter((a) => a.choice === answer), ...answers.filter((a) => a.choice !== answer)];
  const sig = `${answer}|${list.map((a) => a.id).join()}`;
  if (el.dataset.sig === sig) return;
  el.dataset.sig = sig;
  const cls = (a) => (answer == null ? (voterSeen.has(a.id) ? '' : ' new') : a.choice === answer ? ' ok' : ' no');
  const shown = list.slice(0, 80);
  el.innerHTML = shown.map((a) => `<span class="chip${cls(a)}">${h(a.nickname)}</span>`).join('')
    + '<span class="chip more" hidden></span>';
  answers.forEach((a) => voterSeen.add(a.id));
  fitChips(el, list.length - shown.length);
}

// 정답자 추첨 전 화면의 정답자 아이디 (사람 수에 따라 글자 크기를 맞춘다)
function renderRoster(el, pool) {
  const sig = pool.map((p) => p.id).join();
  if (el.dataset.sig === sig) return;
  el.dataset.sig = sig;
  const n = pool.length;
  el.style.setProperty('--fs', `${n <= 8 ? 64 : n <= 20 ? 48 : n <= 50 ? 36 : 28}px`);
  const shown = pool.slice(0, 200);
  el.innerHTML = shown.map((p) => `<span class="chip">${h(p.nickname)}</span>`).join('') + '<span class="chip more" hidden></span>';
  fitChips(el, n - shown.length);
}

// 칸에 다 안 들어가면 뒤쪽 아이디를 '외 N명'으로 묶는다 (마지막 칸이 '외 N명' 자리)
function fitChips(el, rest) {
  const more = el.lastElementChild;
  const chips = [...el.children].slice(0, -1);
  const setMore = () => { more.hidden = rest === 0; more.textContent = `외 ${rest}명`; };
  setMore();
  while (chips.length && el.scrollHeight > el.clientHeight + 1) {
    chips.pop().remove();
    rest++;
    setMore();
  }
}

// 결과 화면에 쓸 이름: 팀명은 뺀다 ("김원 BX팀", "BX팀/김원", "김원(BX팀)", "AT/DT서비스팀 김원",
// "김원BX팀", "김원리테일팀", "김원수도권NW지원팀" → "김원")
// '팀'으로 끝나는 말과 팀 이름으로 보이는 말을 빼고, 남은 것 중 한글 2~4자(이름)를 먼저 고른다.
// 팀 이름 첫머리: 이름 뒤에 띄우지 않고 팀명을 붙여 쓰면 이 말이 시작하는 곳에서 이름을 자른다
const TEAM_HEADS = [
  '수도권', '리테일', '리텐션', '브랜드', '브컴', '전략', '영업', '영기', '기획', '마케팅', '구매', '지원', '수북',
  '경영', '재무', '회계', '인사', '총무', '노무', '노사', '홍보', '법무', '감사', '정책', '대외', '품질', '안전',
  '고객', '서비스', '상품', '사업', '개발', '기술', '운영', '플랫폼', '미디어', '콘텐츠', '채널', '세일즈', '디지털',
  '데이터', '보안', '네트워크', '인프라', '솔루션', '커머스', '커뮤니케이션', '엔터프라이즈', '본사', '본부',
  '부산', '대구', '광주', '대전', '강원', '충청', '호남', '영남', '서부', '동부', '남부', '북부', '중부',
];
const isTeamWord = (w) => w.endsWith('팀') || TEAM_HEADS.includes(w);
function nameOfGlued(w) {
  const han = (w.match(/^[가-힣]+/) || [''])[0];
  if (han.length < 2) return null;
  // "김원BX팀": 한글 뒤에 영문이 붙으면 앞쪽 한글이 이름
  if (han.length <= 4 && (han.length < w.length || !w.endsWith('팀'))) return han;
  // "이상식리테일팀", "이완석수도권NW지원팀": 팀 이름이 시작하는 곳에서 자르고, 못 찾으면 세 글자
  for (const i of [3, 2, 4]) if (han.length > i && TEAM_HEADS.some((t) => han.startsWith(t, i))) return han.slice(0, i);
  return han.length > 4 ? han.slice(0, 3) : null;
}
function shortName(nick) {
  const full = String(nick ?? '').trim();
  const raw = full.replace(/[(（[][^)）\]]*[)）\]]/g, ' ');
  const parts = raw.split(/[\s,/_·|()（）[\].\-]+/).filter(Boolean);
  const rest = parts.filter((w) => !isTeamWord(w));
  const named = rest.find((w) => /^[가-힣]{2,4}$/.test(w));
  if (named) return named;
  const glued = parts.map(nameOfGlued).find(Boolean);
  return glued || rest[0] || parts[0] || full;
}

let measureCtx = null;
function textWidth(s, px) {
  measureCtx ??= document.createElement('canvas').getContext('2d');
  measureCtx.font = `700 ${px}px ${CANVAS_FONT}`;
  return measureCtx.measureText(s).width;
}

// 정답 개수별 인원: 정답 개수마다 이름을 아래에서부터 쌓는다.
// 이름 칸 높이와 한 줄에 놓는 이름 수는 모든 칸에 똑같이 써서, 쌓인 높이가 곧 인원이 되게 한다.
function renderStacks(el, ps, n) {
  const groups = Array.from({ length: n + 1 }, () => []);
  ps.forEach((p) => groups[Math.max(0, Math.min(p.score, n))].push({ id: p.id, name: shortName(p.nickname), full: p.nickname }));
  groups.forEach((g) => g.sort((a, b) => a.name.localeCompare(b.name, 'ko') || String(a.id).localeCompare(String(b.id))));
  const sig = groups.map((g) => g.map((p) => `${p.id}:${p.full}`).join()).join('|');
  if (el.dataset.sig === sig) return;
  el.dataset.sig = sig;

  const cols = n + 1;
  const COL_GAP = 8;
  el.style.setProperty('--cols', cols);
  el.innerHTML = `<div class="stack-cols"></div><div class="stack-x">${groups.map((_, i) => `<span>${i}개</span>`).join('')}</div>`;
  const area = el.firstElementChild;
  const colW = (area.clientWidth - COL_GAP * (cols - 1)) / cols;
  const availH = area.clientHeight - 44; // 위쪽 인원 숫자 자리
  const max = Math.max(1, ...groups.map((g) => g.length));
  // 글자 크기 1px일 때 이름 폭. 대부분(90%)의 이름에 맞춰 크기를 정하고, 그보다 긴 이름만 그 칸에서 글자를 줄인다.
  const all = groups.flat();
  all.forEach((p) => { p.w = textWidth(p.name, 1); });
  const widths = all.map((p) => p.w).sort((a, b) => a - b);
  const p90 = widths.length ? widths[Math.floor((widths.length - 1) * 0.9)] : 0;
  const unit = Math.min(textWidth('가나다라', 1), Math.max(textWidth('가나다', 1), p90));
  const fit = (k) => {
    const gap = 3;
    const rows = Math.ceil(max / k);
    const rh = Math.min(44, (availH - gap * (rows - 1)) / rows);
    const cellW = (colW - gap * (k - 1)) / k;
    return { k, gap, rh, fs: Math.min(24, rh * 0.6, (cellW - 6) / unit) };
  };
  let best = fit(1);
  for (let k = 2; k <= 6; k++) { const f = fit(k); if (f.fs > best.fs) best = f; }
  // 하루 70명이면 한 칸에 모두 몰려도 11px 이상으로 다 들어간다.
  // 그보다 훨씬 많아 글자가 너무 작아질 때만 11px로 쌓고, 넘치는 사람은 맨 위 '+N'으로 묶는다
  let cap = Infinity;
  if (best.fs < 11) {
    const gap = 2, rh = 18;
    let k = 1;
    while (k < 6 && (colW - gap * k) / (k + 1) - 6 >= 11 * unit) k++;
    best = { k, gap, rh, fs: 11 };
    cap = Math.max(1, Math.floor((availH + gap) / (rh + gap))) * k;
  }
  const { k, gap, rh } = best;
  const fs = Math.floor(best.fs);
  const room = (colW - gap * (k - 1)) / k - 6; // 이름 한 칸의 글자 폭
  const own = (p) => (p.w * fs > room ? `;font-size:${Math.max(9, Math.floor(room / p.w))}px` : '');
  el.style.setProperty('--k', k);
  el.style.setProperty('--g', `${gap}px`);
  el.style.setProperty('--rh', `${Math.floor(rh)}px`);
  el.style.setProperty('--fs', `${fs}px`);
  // 아래 줄부터 차례로 쌓이는 연출 (전체 1.6초 안팎)
  const rowsMax = Math.max(1, Math.ceil(Math.min(max, cap) / k));
  const delay = (j, i) => `${((Math.floor(j / k) / rowsMax) * 1.2 + i * 0.04).toFixed(2)}s`;
  area.innerHTML = groups.map((g, i) => {
    const list = g.length > cap ? g.slice(0, cap - 1) : g;
    const more = g.length - list.length;
    const items = list.map((p, j) => `<span title="${h(p.full)}" style="--d:${delay(j, i)}${own(p)}">${h(p.name)}</span>`).join('')
      + (more ? `<span class="more" style="--d:${delay(list.length, i)}">+${more}</span>` : '');
    return `<div class="stack-col${i === n ? ' top' : ''}">${g.length ? `<b>${g.length}<small>명</small></b>` : ''}<div class="stack">${items}</div></div>`;
  }).join('');
}

// ───────── 추첨 연출 ─────────
function chipEls(names) {
  const arena = stageEl.querySelector('[data-arena]');
  arena.innerHTML = names.map((n) => `<span class="chip">${h(n)}</span>`).join('');
  return [...arena.children].map((el) => ({ el, w: el.offsetWidth, h: el.offsetHeight }));
}
function scatter(chips) {
  chips.forEach((c) => {
    c.el.style.transform = `translate(${rand(30, 1890 - c.w)}px, ${rand(150, 1050 - c.h)}px)`;
  });
}
function idleArena(names) {
  const arena = stageEl.querySelector('[data-arena]');
  if (!arena) return;
  arena.className = 'arena idle';
  const pick = [...names].sort(() => Math.random() - 0.5).slice(0, 40);
  const chips = chipEls(pick);
  chips.forEach((c) => { c.el.style.animationDelay = `${-rand(0, 6)}s`; });
  scatter(chips);
}
function fitName(el, name, base, width) {
  el.style.fontSize = `${Math.min(base, Math.floor(width / Math.max(1, name.length) / 0.95))}px`;
}

async function removeWinner(id) {
  try {
    await rpc('quiz_admin_remove_winner', { p_pin: pin, p_winner_id: id });
    refresh();
  } catch (err) { toast(err.message); }
}

async function startDraw() {
  const st = steps[stepIdx];
  const qd = st.stage === 'qdraw';
  if (!drawPool(st).length) {
    toast(qd ? '추첨할 정답자가 없어요.' : '추첨 대상이 없어요. 정답 기준을 낮춰 보세요.');
    return;
  }
  drawing = true;
  let res;
  try {
    res = await rpc('quiz_admin_draw', qd
      ? { p_pin: pin, p_qno: st.qno }
      : { p_pin: pin, p_min_score: minScore() });
  } catch (e) {
    drawing = false;
    toast(e.message);
    return;
  }
  if (!res.winner) {
    drawing = false;
    toast('추첨 대상이 없어요.');
    refresh();
    return;
  }
  await roulette(res.pool || [], res.winner.nickname, res.pool_size);
  showWinner(res.winner);
  // 당첨자 휴대폰이 연출이 끝나자마자 당첨 화면으로 바뀌도록 실시간 알림을 보낸다
  setTimeout(() => rpc('quiz_admin_touch', { p_pin: pin }).catch(() => {}), 900);
  // 새 당첨자를 받아 온 뒤에야 다음 추첨을 받는다 (→를 연달아 눌러 같은 문제에서 한 명 더 뽑히지 않게)
  await refresh();
  drawing = false;
  render();
}

// 룰렛: 참여자 아이디가 적힌 판이 3.5초 동안 빠르게 돌고, 마지막 3초는 칸을 넘길 때마다 점점 더 느려진다.
// 바늘은 판 오른쪽에서 칸 사이 못에 걸려 휘었다가 풀리며 튕기고, 바늘이 가리키는 아이디는
// 오른쪽 이름판에 크게 보여 준다. 멈춘 칸과 이름판이 금색으로 빛나면 당첨 (약 7초)
const WHEEL_COLORS = [
  { fill: '#1d57e6', text: '#fff' },
  { fill: '#ffffff', text: '#0b1f5b' },
  { fill: '#0b1f5b', text: '#fff' },
  { fill: '#dbe6ff', text: '#0b1f5b' },
];
const WHEEL_GOLD = { fill: '#ffcf3f', text: '#0b1f5b' };
const CANVAS_FONT = "'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif";

function wheelImage(names, colors, R, k) {
  const c = document.createElement('canvas');
  c.width = c.height = Math.ceil(R * 2 * k);
  const g = c.getContext('2d');
  g.scale(k, k);
  g.translate(R, R);
  const n = names.length;
  const seg = (Math.PI * 2) / n;
  const outer = R * 0.93;
  const maxW = outer - R * 0.3;
  const base = Math.min(52, ((Math.PI * 2 * R * 0.62) / n) * 0.62);
  names.forEach((name, i) => {
    g.fillStyle = colors[i].fill;
    g.beginPath();
    g.moveTo(0, 0);
    g.arc(0, 0, R, i * seg, (i + 1) * seg);
    g.closePath();
    g.fill();
    // 이름은 칸 크기에 맞춰 줄이고, 그래도 길면 말줄임
    g.save();
    g.rotate((i + 0.5) * seg);
    let size = base;
    let text = name;
    g.font = `800 ${size}px ${CANVAS_FONT}`;
    const w = g.measureText(text).width;
    if (w > maxW) {
      size = Math.max(16, (size * maxW) / w);
      g.font = `800 ${size}px ${CANVAS_FONT}`;
    }
    while (g.measureText(text).width > maxW && text.length > 2) text = `${text.slice(0, -2)}…`;
    g.fillStyle = colors[i].text;
    g.textAlign = 'right';
    g.textBaseline = 'middle';
    g.fillText(text, outer, 0);
    g.restore();
  });
  if (n > 1) {
    g.strokeStyle = 'rgba(11, 31, 91, 0.2)';
    g.lineWidth = 2;
    for (let i = 0; i < n; i++) {
      g.beginPath();
      g.moveTo(0, 0);
      g.lineTo(Math.cos(i * seg) * R, Math.sin(i * seg) * R);
      g.stroke();
    }
  }
  return c;
}

function roulette(pool, winner, poolSize) {
  const root = stageEl.querySelector('.draw');
  const cv = root.querySelector('[data-wheel]');
  const k = Math.min(2, Math.max(1, (devicePixelRatio || 1) * (stageEl.getBoundingClientRect().width / 1920)));
  cv.width = 1920 * k;
  cv.height = 1080 * k;
  const ctx = cv.getContext('2d');
  cv.hidden = false;
  root.classList.add('wheel-on');

  const CX = 640, CY = 590, R = 400, RIM = 30, BULBS = 32;
  const PX = 1500, PY = 590, PW = 640, PH = 300; // 이름판
  const PTR = 0; // 바늘 방향 (판 오른쪽): 이 자리의 아이디가 가로로 읽힌다
  const TAU = Math.PI * 2;
  // 칸이 많으면 글자가 작아지므로 판에는 최대 20명 (당첨자 포함 무작위)
  const names = [winner, ...pool.filter((n) => n !== winner).slice(0, 19)].sort(() => Math.random() - 0.5);
  const n = names.length;
  const seg = TAU / n;
  const w = names.indexOf(winner);
  // 이웃한 칸끼리 같은 색이 되지 않게 (마지막 칸과 첫 칸도 이웃)
  const colors = names.map((_, i) => WHEEL_COLORS[n > 1 && n % 4 === 1 && i === n - 1 ? 2 : i % 4]);
  const plain = wheelImage(names, colors, R, k);
  const lit = wheelImage(names, colors.map((c, i) => (i === w ? WHEEL_GOLD : c)), R, k);

  // 바늘이 멈추는 곳: 당첨 칸에 겨우 넘어 들어왔거나, 다음 칸으로 넘어갈 듯 말 듯 걸린 곳
  const FAST = 3500, SLOW = 3000, SPIN = FAST + SLOW, END = SPIN + 700;
  const th0 = rand(0, TAU);
  const f = Math.random() < 0.5 ? rand(0.76, 0.9) : rand(0.1, 0.22);
  const target = PTR - (w + f) * seg;
  const thEnd = th0 + TAU * 5 + ((((target - th0) % TAU) + TAU) % TAU);
  // 마지막 3초에 4~5칸만 지나가도록 나누고, 두 구간의 속도가 끊김 없이 이어지게 한다
  const dSlow = Math.min(4.5 * seg, 2.6);
  const dFast = thEnd - th0 - dSlow;
  const Ta = FAST / 1000;
  const wB = (3 * dSlow) / (SLOW / 1000);
  const wA = wB + (3 * (dFast - wB * Ta)) / Ta;
  const angleAt = (t) => {
    if (t <= FAST) {
      const sec = t / 1000;
      return th0 + wB * sec + ((wA - wB) * Ta / 3) * (1 - (1 - sec / Ta) ** 3);
    }
    const u = Math.min(1, (t - FAST) / SLOW);
    return th0 + dFast + dSlow * (1 - (1 - u) ** 3);
  };
  // 바늘 아래 칸 위치 (정수 부분 = 칸 번호, 소수 부분이 0에 가까울수록 다음 못에 닿는다)
  const posAt = (th) => ((((PTR - th) % TAU) + TAU) % TAU) / seg;

  const draw = (t, th, needle, cur, pop) => {
    ctx.setTransform(k, 0, 0, k, 0, 0);
    ctx.clearRect(0, 0, 1920, 1080);
    const stopped = t >= SPIN;
    // 테두리 (그림자)
    ctx.save();
    ctx.shadowColor = 'rgba(11, 31, 91, 0.28)';
    ctx.shadowBlur = 50;
    ctx.shadowOffsetY = 20;
    ctx.fillStyle = '#0b1f5b';
    ctx.beginPath();
    ctx.arc(CX, CY, R + RIM, 0, TAU);
    ctx.fill();
    ctx.restore();
    // 판
    ctx.save();
    ctx.translate(CX, CY);
    ctx.rotate(th);
    ctx.drawImage(plain, -R, -R, R * 2, R * 2);
    if (stopped) {
      ctx.globalAlpha = Math.min(1, (t - SPIN) / 200);
      ctx.drawImage(lit, -R, -R, R * 2, R * 2);
    }
    ctx.restore();
    // 테두리 전구: 돌 때는 판을 따라 깜빡이고, 멈추면 다 같이 번쩍인다
    const phase = stopped ? Math.floor((t - SPIN) / 140) % 2 : Math.floor((th / TAU) * BULBS * 2) % 2;
    for (let i = 0; i < BULBS; i++) {
      const a = (i / BULBS) * TAU;
      const on = stopped ? phase === 0 : (i + phase) % 2 === 0;
      ctx.fillStyle = on ? '#ffcf3f' : '#3b4f8f';
      ctx.beginPath();
      ctx.arc(CX + Math.cos(a) * (R + RIM / 2), CY + Math.sin(a) * (R + RIM / 2), 6, 0, TAU);
      ctx.fill();
    }
    // 가운데 축
    const hub = ctx.createRadialGradient(CX - 20, CY - 24, 6, CX, CY, 78);
    hub.addColorStop(0, '#ffffff');
    hub.addColorStop(1, '#dbe6ff');
    ctx.fillStyle = hub;
    ctx.strokeStyle = '#0b1f5b';
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.arc(CX, CY, 74, 0, TAU);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#0b1f5b';
    ctx.font = `900 34px ${CANVAS_FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('추첨', CX, CY + 1);
    // 바늘: 칸을 넘길 때마다 판이 도는 쪽으로 튕긴다
    ctx.save();
    ctx.translate(CX + R + 44, CY);
    ctx.rotate(needle);
    ctx.shadowColor = 'rgba(11, 31, 91, 0.35)';
    ctx.shadowBlur = 12;
    ctx.shadowOffsetY = 4;
    ctx.fillStyle = '#ffcf3f';
    ctx.strokeStyle = '#0b1f5b';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(0, -30);
    ctx.lineTo(0, 30);
    ctx.lineTo(-78, 0);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.shadowColor = 'transparent';
    ctx.fillStyle = '#0b1f5b';
    ctx.beginPath();
    ctx.arc(0, 0, 14, 0, TAU);
    ctx.fill();
    ctx.restore();
    // 이름판: 바늘이 가리키는 아이디를 크게
    ctx.fillStyle = stopped ? '#d39b00' : '#1d57e6';
    ctx.font = `800 46px ${CANVAS_FONT}`;
    ctx.fillText(stopped ? '당첨!' : t < FAST ? '두구두구…' : '과연 누가…?', PX, PY - PH / 2 - 60);
    ctx.save();
    ctx.translate(PX, PY);
    ctx.scale(pop, pop);
    ctx.shadowColor = stopped ? 'rgba(255, 207, 63, 0.7)' : 'rgba(11, 31, 91, 0.18)';
    ctx.shadowBlur = stopped ? 70 : 40;
    ctx.shadowOffsetY = stopped ? 0 : 16;
    ctx.fillStyle = stopped ? '#ffcf3f' : '#ffffff';
    ctx.beginPath();
    ctx.roundRect(-PW / 2, -PH / 2, PW, PH, 40);
    ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.lineWidth = 6;
    ctx.strokeStyle = stopped ? '#d39b00' : '#b9cdfb';
    ctx.stroke();
    const name = names[cur] || '';
    let size = 130;
    ctx.font = `900 ${size}px ${CANVAS_FONT}`;
    const nw = ctx.measureText(name).width;
    if (nw > PW - 80) {
      size = (size * (PW - 80)) / nw;
      ctx.font = `900 ${size}px ${CANVAS_FONT}`;
    }
    ctx.fillStyle = '#0b1f5b';
    ctx.fillText(name, 0, 4);
    ctx.restore();
    // 추첨 대상 인원: 남색 알약 안에 숫자를 금색으로 크게
    const pre = '추첨 대상 ', num = String(poolSize), post = '명';
    const fLabel = `800 44px ${CANVAS_FONT}`, fNum = `900 64px ${CANVAS_FONT}`;
    ctx.font = fLabel;
    const wPre = ctx.measureText(pre).width, wPost = ctx.measureText(post).width;
    ctx.font = fNum;
    const wNum = ctx.measureText(num).width + 8;
    const bw = wPre + wNum + wPost + 72, by = PY + PH / 2 + 100;
    ctx.fillStyle = '#0b1f5b';
    ctx.beginPath();
    ctx.roundRect(PX - bw / 2, by - 50, bw, 100, 50);
    ctx.fill();
    let x = PX - bw / 2 + 36;
    ctx.textAlign = 'left';
    ctx.fillStyle = '#ffffff';
    ctx.font = fLabel;
    ctx.fillText(pre, x, by + 2);
    x += wPre;
    ctx.fillStyle = '#ffcf3f';
    ctx.font = fNum;
    ctx.fillText(num, x + 4, by + 2);
    x += wNum;
    ctx.fillStyle = '#ffffff';
    ctx.font = fLabel;
    ctx.fillText(post, x, by + 2);
    ctx.textAlign = 'center';
  };

  return new Promise((resolve) => {
    const t0 = performance.now();
    let last = t0, idx = Math.floor(posAt(th0)), osc = 0, oscV = 0, needle = 0, tick = -1e9, rang = false;
    sfx.drumroll(SPIN);
    const frame = (now) => {
      const t = now - t0;
      const dt = Math.min(1 / 30, (now - last) / 1000);
      last = now;
      const th = angleAt(t);
      const pos = posAt(th);
      const cur = Math.floor(pos);
      // 못에 가까워질수록 바늘이 판이 도는 쪽으로 휘고, 못을 넘기면 풀리며 흔들린다
      const bend = Math.max(0, (0.3 - (pos - cur)) / 0.3);
      if (cur !== idx) { idx = cur; osc = needle; oscV = 0; tick = t; if (t < SPIN) sfx.peg(t > FAST); }
      if (!rang && t >= SPIN) { rang = true; sfx.stop(); }
      oscV += (-300 * osc - 12 * oscV) * dt;
      osc += oscV * dt;
      needle = -0.38 * bend + osc;
      // 느려진 뒤에는 이름이 바뀔 때마다 이름판이 살짝 튀어 오른다
      const pop = t > FAST - 300 ? 1 + 0.07 * Math.exp(-(t - tick) / 120) : 1;
      draw(t, th, needle, cur, pop);
      if (t < END) requestAnimationFrame(frame);
      else resolve();
    };
    requestAnimationFrame(frame);
  });
}

function confetti(canvas) {
  const ctx = canvas.getContext('2d');
  const colors = ['#ffcf3f', '#ffffff', '#5b8cff', '#1d57e6', '#ffe58a', '#b9cdfb'];
  const parts = [];
  const burst = (x, y, dir, count) => {
    for (let i = 0; i < count; i++) {
      const a = (dir + rand(-0.55, 0.55));
      const sp = rand(14, 30);
      parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, w: rand(10, 22), h: rand(6, 12), r: rand(0, 6), vr: rand(-0.3, 0.3), c: colors[i % colors.length], life: rand(140, 220) });
    }
  };
  burst(0, 1080, -Math.PI / 3.2, 160);
  burst(1920, 1080, -Math.PI + Math.PI / 3.2, 160);
  setTimeout(() => burst(960, 1100, -Math.PI / 2, 140), 350);
  let frame = 0;
  const tick = () => {
    if (!canvas.isConnected) return;
    ctx.clearRect(0, 0, 1920, 1080);
    let alive = 0;
    parts.forEach((p) => {
      if (p.life-- <= 0) return;
      alive++;
      p.vx *= 0.985; p.vy = p.vy * 0.985 + 0.55; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.r);
      ctx.globalAlpha = Math.min(1, p.life / 40);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 2)));
      ctx.restore();
    });
    if (alive || frame++ < 30) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

addEventListener('keydown', (e) => {
  if (document.querySelector('dialog[open]')) return;
  if (e.target.closest?.('input, textarea, select')) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(k)) { e.preventDefault(); next(); }
  else if (['ArrowLeft', 'PageUp'].includes(k)) { e.preventDefault(); prev(); }
  else if (k === 'ArrowDown' || k === 'End') { e.preventDefault(); go(stepIdx + 1); }
  else if (k === 'ArrowUp' || k === 'Home') { e.preventDefault(); go(stepIdx - 1); }
  // 한글 입력 상태(ㄹ, ㅡ)에서도 되도록 키 자리로도 본다
  else if (k === 'f' || k === 'F' || e.code === 'KeyF') toggleFs();
  else if (k === 'm' || k === 'M' || e.code === 'KeyM') toggleSound();
});

function asksOf(filter) {
  if (filter === 'all') return asks;
  const list = asks.filter((a) => a.status === filter);
  if (filter !== 'pick') return list;
  return list.sort((x, y) => (x.sort_order ?? Infinity) - (y.sort_order ?? Infinity) || new Date(x.created_at) - new Date(y.created_at));
}

function askTime(s) {
  const d = new Date(s);

  return `${d.getMonth() + 1}월 ${d.getDate()}일 ${two(d.getHours())}:${two(d.getMinutes())}`;
}

          <textarea class="field" data-k="question" maxlength="200" placeholder="문제를 입력하세요">${h(q.question)}</textarea>
          <div class="qe-opts">
            ${q.options.map((o, j) => `
              <label class="qe-opt${q.answer === j ? ' ans' : ''}">
                <input type="radio" name="ans${i}" value="${j}" ${q.answer === j ? 'checked' : ''} title="정답으로 지정">
                <input class="field" data-opt="${j}" maxlength="40" value="${h(o)}" placeholder="보기 ${j + 1}${j >= 2 ? ' (비워두면 생략)' : ''}">
              </label>`).join('')}
          </div>
          <input class="field" data-k="explanation" maxlength="200" value="${h(q.explanation)}" placeholder="해설 (선택 · 정답 공개 때 화면에 표시)">
          <small>왼쪽 동그라미로 정답을 고르세요. 보기는 2~4개까지 쓸 수 있어요.</small>
        </div>`).join('')}
      <button class="btn ghost" type="button" data-act="add" ${draft.length >= 30 ? 'disabled' : ''}>+ 문제 추가</button>`;
    setFoot.innerHTML = `<span class="note">문제 ${draft.length}개 · 저장하면 참여자 화면에도 바로 반영돼요</span><button class="btn" type="button" data-act="save">문제 저장</button>`;
  } else if (tab === 'event') {
    setBody.innerHTML = `
      <div class="set-section">
        <h3>행사 제목</h3>
        <p>표지와 참여자 휴대폰 화면 맨 위에 표시돼요.</p>
        <div class="set-row"><input class="field" id="evTitle" maxlength="30" value="${h(status.state.title)}"></div>
        <h3 style="margin-top:16px">부제</h3>
        <div class="set-row"><input class="field" id="evSub" maxlength="40" value="${h(status.state.subtitle)}"></div>
      </div>
      <div class="set-section">
        <h3>참여 주소</h3>
        <p>QR 코드가 이 주소로 연결돼요. 미리 휴대폰으로 열어 확인해 보세요.</p>
        <div class="linkbox"><a href="${h(joinUrl)}" target="_blank" rel="noopener">${h(joinUrl)}</a></div>
      </div>`;
    setFoot.innerHTML = `<span class="note"></span><button class="btn" type="button" data-act="info">저장</button>`;
  } else if (tab === 'people') {
    const ps = status.participants;
    setBody.innerHTML = `
      <div class="set-section">
        <h3>참여자 ${ps.length}명</h3>
        <p>부적절한 아이디는 ×로 지울 수 있어요. 지워진 사람은 휴대폰에서 다시 참여해야 해요.</p>
        <div class="plist">${ps.map((p) => `<span class="${p.demo ? 'demo' : ''}">${h(p.nickname)}<button type="button" data-del="${p.id}" data-name="${h(p.nickname)}" title="삭제">×</button></span>`).join('') || '<em style="color:var(--muted)">아직 참여자가 없어요</em>'}</div>
      </div>
      <div class="set-section">
        <h3>리허설</h3>
        <p>테스트 참여자 30명을 만들고 모든 문제에 무작위로 답하게 해요. 추첨 연출을 미리 볼 때 쓰고, 행사 전에 꼭 '전체 초기화'를 눌러 지워주세요.</p>
        <button class="btn ghost" type="button" data-act="demo">테스트 참여자 30명 추가</button>
      </div>
      <div class="set-section">
        <h3>초기화</h3>
        <p>문제와 조합원 질문은 그대로 두고 기록만 지워요.</p>
        <div class="set-row">
          <button class="btn ghost" type="button" data-act="reset-winners">당첨 기록만 초기화</button>
          <button class="btn danger" type="button" data-act="reset-all">전체 초기화 (참여자·답변·당첨)</button>
        </div>
      </div>`;
    setFoot.innerHTML = '';
  } else if (tab === 'asks') {
    const list = asksOf(askFilter);
    const picks = asksOf('pick').length;
    const filters = [['new', '새 질문'], ['pick', '올릴 질문'], ['hold', '보류'], ['all', '전체']];
    setBody.innerHTML = `
      <div class="warn">질문 원문이 보이는 화면이에요. 스크린에 띄운 상태라면 화면 공유를 끄고 정리하세요.</div>
      <div class="set-section">
        <h3>조합원에게 보낼 링크<span class="ask-state ${askOpen ? 'on' : ''}">${askOpen ? '접수 중' : '접수 마감'}</span></h3>
        <p>메일에 이 주소를 넣어 보내세요. 조합원은 로그인 없이 바로 질문을 남길 수 있어요.</p>
        <div class="set-row">
          <div class="linkbox"><a href="${h(askUrl)}" target="_blank" rel="noopener">${h(askUrl)}</a></div>
          <button class="btn ghost" type="button" data-act="ask-link">링크 복사</button>
          <button class="btn ghost" type="button" data-act="ask-toggle">${askOpen ? '접수 마감하기' : '접수 다시 열기'}</button>
        </div>
      </div>
      <div class="ask-filter">
        ${filters.map(([f, name]) => `<button type="button" data-act="ask-filter" data-f="${f}" class="${askFilter === f ? 'on' : ''}">${name} ${asksOf(f).length}</button>`).join('')}
      </div>
      ${list.map((a, i) => askCard(a, i, list.length)).join('') || `<p class="ask-empty">${asks.length ? '이 목록에는 질문이 없어요.' : '아직 접수된 질문이 없어요.'}</p>`}`;
    setFoot.innerHTML = `
      <span class="note">올릴 질문은 이 순서대로 표지 다음 화면에 나와요. 복사해서 위원장에게 미리 전달할 수도 있어요.</span>
      <button class="btn ghost" type="button" data-act="ask-reload">새로고침</button>
      <button class="btn" type="button" data-act="ask-copy" ${picks ? '' : 'disabled'}>올릴 질문 ${picks}개 복사</button>`;
  } else {
    setBody.innerHTML = `
      <div class="set-section">
        <h3>관리자 PIN 변경</h3>
        <p>6자 이상으로 정해주세요. 바꾸면 다른 기기에서는 새 PIN으로 다시 로그인해야 해요.</p>
        <div class="set-row"><input class="field" id="newPin" type="password" autocomplete="new-password" placeholder="새 PIN"><button class="btn" type="button" data-act="pin">변경</button></div>
      </div>
      <div class="set-section">
        <h3>이 기기에서 로그아웃</h3>
        <p>저장된 PIN을 이 브라우저에서 지워요.</p>
        <button class="btn ghost" type="button" data-act="logout">로그아웃</button>
      </div>`;
    setFoot.innerHTML = '';
  }
}

setBody.addEventListener('input', (e) => {
  const card = e.target.closest('.qe');
  if (!card) return;
  const q = draft[Number(card.dataset.i)];
  if (e.target.dataset.k) q[e.target.dataset.k] = e.target.value;
  if (e.target.dataset.opt != null) q.options[Number(e.target.dataset.opt)] = e.target.value;
  if (e.target.type === 'radio') {
    q.answer = Number(e.target.value);
    card.querySelectorAll('.qe-opt').forEach((l, j) => l.classList.toggle('ans', j === q.answer));
  }
});

// 다듬은 문구는 입력칸을 벗어날 때 저장한다
setBody.addEventListener('change', async (e) => {
  if (!e.target.matches('[data-ask-edit]')) return;
  const a = asks.find((x) => x.id === e.target.closest('.ask').dataset.id);
  a.edited = e.target.value.trim();
  try {
    await rpc('quiz_admin_ask_update', { p_pin: pin, p_id: a.id, p_edited: a.edited });
    toast('문구를 저장했어요.');
  } catch (err) {
    toast(err.message);
  }
});

setDlg.addEventListener('click', async (e) => {
  const actEl = e.target.closest('[data-act]');
  const act = actEl?.dataset.act;
  const del = e.target.closest('[data-del]');
  const card = e.target.closest('.qe');
  const i = card ? Number(card.dataset.i) : -1;
  const askId = e.target.closest('.ask')?.dataset.id;
  try {
    if (act === 'ask-filter') {
      askFilter = actEl.dataset.f;
      renderTab();
    } else if (act === 'ask-link') {
      await copyText(askUrl);
      toast('링크를 복사했어요.');
    } else if (act === 'ask-toggle') {
      if (askOpen && !confirm('질문 접수를 마감할까요?\n링크를 열면 마감 안내가 보이고, 다시 열 수도 있어요.')) return;
      await rpc('quiz_admin_ask_open', { p_pin: pin, p_open: !askOpen });
      await loadAsks();
      renderTab();
    } else if (act === 'ask-reload') {
      await loadAsks();
      renderTab();
      toast(`질문 ${asks.length}개를 불러왔어요.`);
    } else if (act === 'ask-copy') {
      const picks = asksOf('pick');
      await copyText(`본사2지부 조합원 사전 질문 ${picks.length}개\n\n${picks.map((a, n) => `${n + 1}. ${a.edited || a.body}`).join('\n\n')}`);
      toast(`질문 ${picks.length}개를 복사했어요.`);
    } else if (act === 'ask-pick' || act === 'ask-hold') {
      await rpc('quiz_admin_ask_update', { p_pin: pin, p_id: askId, p_status: act.slice(4) });
      await loadAsks();
      renderTab();
    } else if (act === 'ask-up' || act === 'ask-down') {
      const ids = asksOf('pick').map((a) => a.id);
      const from = ids.indexOf(askId);
      const to = from + (act === 'ask-up' ? -1 : 1);
      [ids[from], ids[to]] = [ids[to], ids[from]];
      await rpc('quiz_admin_ask_order', { p_pin: pin, p_ids: ids });
      await loadAsks();
      renderTab();
    } else if (act === 'ask-del') {
      if (!confirm('이 질문을 지울까요?\n되돌릴 수 없어요.')) return;
      await rpc('quiz_admin_ask_delete', { p_pin: pin, p_id: askId });
      await loadAsks();
      renderTab();
    } else if (del) {
      if (!confirm(`'${del.dataset.name}' 참여자를 지울까요?`)) return;
      await rpc('quiz_admin_delete_participant', { p_pin: pin, p_id: del.dataset.del });
      await refresh();
      renderTab();
    } else if (act === 'add') {
      draft.push({ question: '', options: ['', '', '', ''], answer: 0, explanation: '' });
      renderTab();
      setBody.scrollTop = setBody.scrollHeight;
    } else if (act === 'del') {
      if (draft.length <= 1) return toast('문제는 1개 이상 있어야 해요.');
      draft.splice(i, 1);
      renderTab();
    } else if (act === 'ox') {
      draft[i].options = ['O', 'X', '', ''];
      if (draft[i].answer > 1) draft[i].answer = 0;
      renderTab();
    } else if (act === 'four') {
      draft[i].options = draft[i].options.map((o) => (o === 'O' || o === 'X' ? '' : o));
      renderTab();
    } else if (act === 'save') {
      const payload = [];
      for (const [n, q] of draft.entries()) {
        const filled = q.options.map((o, j) => ({ o: o.trim(), j })).filter((x) => x.o);
        const ans = filled.findIndex((x) => x.j === q.answer);
        if (!q.question.trim()) throw new Error(`Q${n + 1}: 문제를 입력해 주세요.`);
        if (filled.length < 2) throw new Error(`Q${n + 1}: 보기를 2개 이상 입력해 주세요.`);
        if (ans < 0) throw new Error(`Q${n + 1}: 정답으로 고른 보기가 비어 있어요.`);
        payload.push({ question: q.question.trim(), options: filled.map((x) => x.o), answer: ans, explanation: q.explanation.trim() });
      }
      await rpc('quiz_admin_save_questions', { p_pin: pin, p_questions: payload });
      await loadQuestions();
      await refresh();
      toast(`문제 ${payload.length}개를 저장했어요.`);
    } else if (act === 'info') {
      await rpc('quiz_admin_set_info', { p_pin: pin, p_title: document.getElementById('evTitle').value, p_subtitle: document.getElementById('evSub').value });
      await refresh();
      toast('행사 정보를 저장했어요.');
    } else if (act === 'demo') {
      const n = await rpc('quiz_admin_seed_demo', { p_pin: pin, p_count: 30 });
      await refresh();
      renderTab();
      toast(n ? `테스트 참여자 ${n}명을 추가했어요.` : '이미 테스트 참여자가 있어요.');
    } else if (act === 'reset-winners') {
      if (!confirm('당첨 기록을 모두 지울까요?')) return;
      await rpc('quiz_admin_reset', { p_pin: pin, p_scope: 'winners' });
      await refresh();
      toast('당첨 기록을 지웠어요.');
    } else if (act === 'reset-all') {
      if (!confirm('참여자, 답변, 당첨 기록을 모두 지우고 표지로 돌아갈까요?\n되돌릴 수 없어요.')) return;
      await rpc('quiz_admin_reset', { p_pin: pin, p_scope: 'all' });
      await refresh();
      renderTab();
      toast('전체 초기화했어요.');
    } else if (act === 'pin') {
      const v = document.getElementById('newPin').value.trim();
      await rpc('quiz_admin_set_pin', { p_pin: pin, p_new_pin: v });
      pin = v;
      store.set(PIN_KEY, v);
      toast('PIN을 바꿨어요.');
      renderTab();
    } else if (act === 'logout') {
      store.set(PIN_KEY, null);
      location.reload();
    }
  } catch (err) {
    toast(err.message);
  }
});

if (pin) start();
else showLogin();
</script>
</body>
</html>
